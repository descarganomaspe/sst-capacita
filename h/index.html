.frec>span:last-child{flex:0 0 auto;font-weight:700;text-align:right}

      var A=AGENTE[U.a] || null, kg=/^[0-9]{1,3}([.,][0-9]{1,2})?$/.test(String(U.kg||'')) ? String(U.kg).replace('.', ',') : '', r=/^20\d{2}-(0[1-9]|1[0-2])$/.test(String(U.r||'')) ? String(U.r) : '';
      if(A || kg || r){
        h+='<div class="tarj" id="ext"><h2>'+esc(t('El extintor'))+'</h2>';
        if(A || kg) h+='<p class="agente"><b>'+[A ? esc(t(A[0])) : '', kg ? esc(kg)+' kg' : ''].filter(Boolean).join(' · ')+'</b></p>';
        if(A){
          h+='<p style="margin:8px 0 0">'+esc(t('Sirve para:'))+'</p><div class="clases">'+A[1].split('').map(function(c){ return '<div class="clase"><i>'+c+'</i><span>'+esc(t(CLASE[c]))+'</span></div>'; }).join('')+'</div>';
          if(A[2]) h+='<p class="no-usar">'+esc(t(A[2]))+'</p>';
        }
        if(r){
          var mm=r.slice(5, 7)+'/'+r.slice(0, 4), ya=!!(j.mes && r < String(j.mes));
          h+='<p class="recarga '+(ya ? 'mal' : 'ok')+'" id="recarga">'+esc(ya ? t('La recarga venció en {0}: avisa a tu supervisor.', mm) : t('Recarga vigente hasta {0}.', mm))+'</p>';
        }
        h+='</div>';
      }
    }
    return h;
  }
  /* 15/10/2026 · lote 12 · cómo va cada una: la última, si fue en papel (con su hoja: solo del almacén de OBRASST), hasta
     cuándo vale y si está al día */
  var ALMACEN='https://gwjjkknuiumgysezeatz.supabase.co/storage/v1/object/public/msds/';
  function frecHtml(RV, FREC_N){
    return '<div class="tarj" id="frecs"><h2>'+esc(t('Sus inspecciones'))+'</h2><div class="hist frecs">'+RV.map(function(x){
      var st=x.al_dia ? ['r-ok', x.q==='diaria' ? 'Hoy, al día' : 'Al día'] : (x.f ? ['r-mal', x.q==='diaria' ? 'Hoy falta' : 'Vencida'] : ['r-ojo', x.q==='diaria' ? 'Hoy falta' : 'Falta']);
      var det=x.f ? t('La última: {0}.', fecha(x.f))+(x.papel ? ' '+t('En papel.') : '')+
                    ((x.q!=='diaria' && x.hasta) ? ' '+(x.al_dia ? t('Vale hasta {0}.', fecha(x.hasta)) : t('Venció el {0}.', fecha(x.hasta))) : '')
                  : t('Todavía no tiene ninguna.');
      var hoja=(x.u && String(x.u).indexOf(ALMACEN)===0 && !/["'<>\s]/.test(String(x.u))) ? '<a class="hoja" href="'+esc(x.u)+'" target="_blank" rel="noopener">📄 '+esc(t('Ver la hoja'))+'</a>' : '';
      return '<div class="frec" data-frec="'+esc(x.q)+'"><span><b>'+esc(t(FREC_N[x.q] || x.q))+'</b><small>'+esc(det)+'</small>'+hoja+'</span><span class="'+st[0]+'">'+esc(t(st[1]))+'</span></div>';
    }).join('')+'</div></div>';
  }
  try{ document.documentElement.lang=L; document.title=t('Equipo de la obra')+' · OBRASST'; }catch(_d){}
  var cuerpo=document.getElementById('cuerpo'), pie=document.getElementById('pie');
  try{ var h1=cuerpo.querySelector('h1'); if(h1) h1.textContent=t('Buscando el equipo…'); }catch(_b){}
  var tk=q('t').toLowerCase().replace(/[^0-9a-f]/g,'');
  function di(titulo, texto){ cuerpo.innerHTML='<h1>'+esc(t(titulo))+'</h1>'+(texto ? '<div class="tarj"><p style="margin:0">'+esc(t(texto))+'</p></div>' : ''); }
  if(!tk){ di('Esta etiqueta está incompleta', 'Al QR le falta su ficha. Pídele a tu supervisor que vuelva a imprimir la etiqueta desde OBRASST.'); return; }
  fetch(SB+'/rest/v1/rpc/sst_equipo_abrir', {
    method:'POST', headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},
    body: JSON.stringify({p_t:tk})
  }).then(function(r){ return r.ok ? r.json() : Promise.reject(r.status); }).then(function(j){
    j = j || {};
    if(j.obra) pie.textContent = j.obra;
    if(!j.ok){
      if(j.error==='no_existe') di('Esta etiqueta ya no está activa', 'Pídele a tu supervisor que imprima la etiqueta nueva desde OBRASST, en «Equipos y herramientas».');
      else di('No se pudo abrir', 'Vuelve a escanear la etiqueta en un momento. Si sigue igual, avísale a tu supervisor.');
      return;
    }
    var u=j.ult||{}, mes=String(j.mes||String(j.hoy||'').slice(0,7)), nomMes=MESES[L][(parseInt(mes.slice(5,7),10)||1)-1]||'';
    var alDia = (u.r==='conforme' && String(u.f||'').slice(0,7)===mes);
    var est, cls, obs=u.o ? esc(u.o)+(/[.!?]$/.test(String(u.o).trim()) ? '' : '.') : '';
    /* 03/10/2026 · la inspección diaria (la que hace quien lo va a usar, con este mismo QR): las grúas,
       las escaleras, los andamios, los montacargas y los que tienen checklist propio dicen cómo va la de HOY; los demás
       siguen con su revisión del mes. Si el servidor todavía no la trae, todo queda como antes. */
    var DIARIA={'Grúa torre':1,'Grúa móvil':1,'Camión grúa':1,'Puente grúa':1,'Otra grúa':1,'Escalera':1,'Andamio':1,'Montacargas':1};
    var ih=(j.insp_hoy && typeof j.insp_hoy==='object') ? j.insp_hoy : null;
    var diaria=('insp_hoy' in j) && !!(DIARIA[j.tipo] || (Array.isArray(j.checklist) && j.checklist.length));
    /* 15/10/2026 · lote 12 · si la obra eligió las que le tocan, ellas mandan: la diaria (si le toca) arriba, como siempre,
       también si se hizo en papel; sin diaria, «al día» lo dicen las otras. Sin elegir, como antes. */
    var FR=(Array.isArray(j.frec) && j.frec.length) ? j.frec : null, RV=(FR && Array.isArray(j.revs)) ? j.revs : [];
    var rvDe=function(q){ return RV.filter(function(x){ return x && x.q===q; })[0] || null; };
    if(FR) diaria=('insp_hoy' in j) && FR.indexOf('diaria')>-1;
    var dRv=FR ? rvDe('diaria') : null, conMes=!FR || FR.indexOf('mensual')>-1;
    var otras=RV.filter(function(x){ return x && x.q!=='diaria'; });
    var FREC_N={diaria:'Diaria', semanal:'Semanal', mensual:'Mensual', trimestral:'Trimestral', semestral:'Semestral', anual:'Anual'};
    var firmasTx=function(i){ return (i.prod && i.sst) ? t('Con sus tres firmas.') : ((!i.prod && !i.sst) ? t('Faltan las firmas de Producción y de SST.') : (i.prod ? t('Falta la firma de SST.') : t('Falta la firma de Producción.'))); };
    if(j.estado==='baja'){ cls='baja'; est='<b>'+esc(t('DADO DE BAJA'))+'</b><span>'+esc(t('Ya no se usa en la obra.'))+'</span>'; }
    else if(j.estado==='fuera'){ cls='mal'; est='<b>'+esc(t('FUERA DE SERVICIO'))+'</b><span>'+esc(t('No lo uses.'))+(obs ? ' '+obs : '')+'</span>'; }
    else if(diaria && ih && ih.r==='observado'){ cls='ojo'; est='<b>'+esc(t('CON OBSERVACIÓN'))+'</b><span>'+esc(ih.h ? t('Inspeccionado hoy a las {0}.', ih.h) : t('Inspeccionado hoy.'))+' '+esc(t('Consulta con tu supervisor antes de usarlo.'))+'</span>'; }
    else if(diaria && ih){ cls='ok'; est='<b>'+esc(t('INSPECCIONADO HOY'))+'</b><span>'+esc(ih.h ? t('A las {0}.', ih.h) : t('Inspeccionado hoy.'))+'</span>'; }
    else if(diaria && dRv && dRv.al_dia && dRv.r==='observado'){ cls='ojo'; est='<b>'+esc(t('CON OBSERVACIÓN'))+'</b><span>'+esc(t('Inspeccionado hoy, en papel.'))+' '+esc(t('Consulta con tu supervisor antes de usarlo.'))+'</span>'; }
    else if(diaria && dRv && dRv.al_dia){ cls='ok'; est='<b>'+esc(t('INSPECCIONADO HOY'))+'</b><span>'+esc(t('En papel.'))+'</span>'; }
    else if(diaria){ cls='ojo'; est='<b>'+esc(t('HOY SIN INSPECCIÓN'))+'</b><span>'+esc(t('Inspecciónalo antes de usarlo.'))+'</span>'; }
    else if(FR && !(conMes && u.r==='observado')){
      if(otras.some(function(x){ return x.r==='observado'; })){ cls='ojo'; est='<b>'+esc(t('CON OBSERVACIÓN'))+'</b><span>'+esc(t('Su última inspección salió con observación.'))+' '+esc(t('Consulta con tu supervisor antes de usarlo.'))+'</span>'; }
      else if(otras.length && otras.every(function(x){ return x.al_dia; })){ cls='ok'; est='<b>'+esc(t('AL DÍA'))+'</b><span>'+esc(t('Sus inspecciones están al día.'))+'</span>'; }
      else { cls='ojo'; est='<b>'+esc(t('LE TOCA REVISIÓN'))+'</b><span>'+esc(t('Le toca: {0}.', otras.filter(function(x){ return !x.al_dia; }).map(function(x){ return t(FREC_N[x.q] || x.q).toLowerCase(); }).join(', ')))+'</span>'; }
    }
    else if(u.r==='observado'){ cls='ojo'; est='<b>'+esc(t('CON OBSERVACIÓN'))+'</b><span>'+(obs ? obs+' ' : '')+esc(t('Consulta con tu supervisor antes de usarlo.'))+'</span>'; }
    else if(alDia){ cls='ok'; est='<b>'+esc(t('AL DÍA'))+'</b><span>'+esc(t('Revisado el {0}.', fecha(u.f)))+'</span>'; }
    else { cls='ojo'; est='<b>'+esc(t('LE TOCA REVISIÓN'))+'</b><span>'+esc(u.f ? t('La última fue el {0}.', fecha(u.f)) : t('Todavía no tiene ninguna revisión.'))+'</span>'; }
    var h='<div class="estado '+cls+'" id="estado">'+est+'</div>';
    h+='<div class="eq"><span class="cod">'+esc(j.codigo)+'</span><span class="tipo">'+esc(tipo(j.tipo))+'</span>'+(j.detalle ? '<span class="det">'+esc(j.detalle)+'</span>' : '')+'</div>';
    /* 14/10/2026 · cómo usarlo, primero (en una emergencia es lo que se busca); no si está fuera de servicio o de baja */
    if(j.estado!=='baja' && j.estado!=='fuera') h+=usoHtml(j);
    if(ih && j.estado!=='baja'){
      var RR={conforme:['Conforme','r-ok'], observado:['Con observación','r-ojo'], no_apto:['No apto','r-mal']}[ih.r] || [String(ih.r||''),''];
      h+='<div class="tarj" id="insp-hoy"><h2>'+esc(t('La inspección de hoy'))+'</h2><div class="hist"><div><span>'+esc(ih.h||'')+'</span><span class="'+RR[1]+'">'+esc(t(RR[0]))+'</span></div></div>'+
         '<p class="firmas '+((ih.prod && ih.sst) ? 'ok' : 'falta')+'">'+esc(firmasTx(ih))+'</p>'+
         (ih.n>1 ? '<p style="margin:6px 0 0">'+esc(t('{0} inspecciones hoy.', ih.n))+'</p>' : '')+'</div>';
    }
    if(FR && RV.length && j.estado!=='baja') h+=frecHtml(RV, FREC_N);
    if(conMes && (j.color_mes || u.c)){
      h+='<div class="tarj"><h2>'+esc(t('La cinta'))+'</h2>';
      if(j.color_mes) h+='<div class="cinta">'+(function(){ var c=color(j.color_mes); return c ? '<i style="background:'+c[1]+'"></i>' : ''; })()+
        '<span>'+esc(t('{0} es el color de {1}.', nomColor(j.color_mes), nomMes))+'</span></div>';
      if(u.c && alDia && j.color_mes && String(u.c).toLowerCase()!==String(j.color_mes).toLowerCase())
        h+='<p style="margin:8px 0 0">'+esc(t('En la revisión le pusieron la {0}.', cintaDe(u.c)))+'</p>';
      h+='</div>';
    }
    var cont=Array.isArray(j.contenido) ? j.contenido.filter(function(x){ return x && String(x).trim(); }) : [];
    if(cont.length) h+='<div class="tarj"><h2>'+esc(t('Lo que tiene'))+'</h2><ul>'+cont.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join('')+'</ul></div>';
    var hist=Array.isArray(j.hist) ? j.hist : [];
    if(hist.length && conMes){
      var R={conforme:['Conforme','r-ok'], observado:['Con observación','r-ojo'], fuera:['Fuera de servicio','r-mal']};
      h+='<div class="tarj"><h2>'+esc(t('Las últimas revisiones'))+'</h2><div class="hist">'+hist.map(function(x){
        var r=R[x.r]||[x.r,''];
        return '<div><span>'+esc(fecha(x.f))+(x.c ? ' · '+esc(cintaDe(x.c)) : '')+'</span><span class="'+r[1]+'">'+esc(t(r[0]))+'</span></div>';
      }).join('')+'</div></div>';
    }
    if(j.estado!=='baja'){
      h+='<a class="btn" href="../?equipo='+encodeURIComponent(tk)+'">'+esc(t('Inspeccionarlo en OBRASST'))+'</a>';
      h+='<p class="nota">'+esc(t('La inspección se hace en la app: checklist, fotos y firma.'))+'</p>';
    }
    cuerpo.innerHTML=h;
    /* 13/10/2026 · con candados puestos (bloqueo y etiquetado): BLOQUEADO, por encima de todo lo demás. Sin nombres:
       esta página la abre cualquiera que escanee el QR. */
    if(j.estado!=='baja') fetch(SB+'/rest/v1/rpc/sst_bloqueo_ver', { method:'POST', credentials:'omit',
        headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'}, body:JSON.stringify({p_t:tk}) })
      .then(function(r){ return r.ok ? r.json() : null; }).then(function(b){
        var l=(b && b.ok && Array.isArray(b.bloqueos)) ? b.bloqueos : [];
        if(!l.length) return;
        var EN={electrica:['⚡','Eléctrica'], mecanica:['⚙️','Mecánica'], hidraulica:['💧','Hidráulica'], neumatica:['💨','Neumática'],
                termica:['🔥','Térmica'], quimica:['🧪','Química'], gravedad:['⬇️','Por gravedad'], otra:['❔','Otra']};
        var es=document.getElementById('estado');
        if(es){ es.className='estado bloq'; es.innerHTML='<b>🔒 '+esc(t('BLOQUEADO'))+'</b><span>'+esc(l.length===1 ? t('No lo uses ni lo enciendas: tiene un candado puesto.') : t('No lo uses ni lo enciendas: tiene {0} candados puestos.', l.length))+'</span>'; }
        var hh='<div class="tarj" id="bloqueos"><h2>'+esc(t('Los candados'))+'</h2><div class="hist">'+l.map(function(x){
          var d=new Date(x.desde), hora=isNaN(d) ? '' : ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
          return '<div><span>'+(x.energia||[]).map(function(k){ var e=EN[k]||['','']; return e[0]+' '+esc(t(e[1])); }).join(' · ')+'</span>'+
                 '<span>'+(x.candado ? esc(t('Candado {0}', x.candado))+' · ' : '')+esc(t('desde las {0}', hora))+'</span></div>';
        }).join('')+'</div><p class="firmas falta" style="margin-top:10px">'+esc(t('Solo quien puso su candado lo quita.'))+'</p></div>';
        var eq=cuerpo.querySelector('.eq'); if(eq) eq.insertAdjacentHTML('afterend', hh);
      }, function(){});
  }).catch(function(){
    di('Sin internet', 'Necesitas señal para ver este equipo. Vuelve a escanear la etiqueta cuando tengas datos o wifi.');
  });
})();
</script>
