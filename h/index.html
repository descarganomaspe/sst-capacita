    var u=j.ult||{}, mes=String(j.mes||String(j.hoy||'').slice(0,7)), nomMes=MESES[L][(parseInt(mes.slice(5,7),10)||1)-1]||'';
    var alDia = (u.r==='conforme' && String(u.f||'').slice(0,7)===mes);
    var est, cls, obs=u.o ? esc(u.o)+(/[.!?]$/.test(String(u.o).trim()) ? '' : '.') : '';
    /* 03/10/2026 · la inspección diaria (la que hace quien lo va a usar, con este mismo QR): las grúas,
       las escaleras, los andamios, los montacargas y los que tienen checklist propio dicen cómo va la de HOY; los demás
       siguen con su revisión del mes. Si el servidor todavía no la trae, todo queda como antes. */
    var DIARIA={'Grúa torre':1,'Grúa móvil':1,'Camión grúa':1,'Puente grúa':1,'Otra grúa':1,'Escalera':1,'Andamio':1,'Montacargas':1};
    var ih=(j.insp_hoy && typeof j.insp_hoy==='object') ? j.insp_hoy : null;
    var diaria=('insp_hoy' in j) && !!(DIARIA[j.tipo] || (Array.isArray(j.checklist) && j.checklist.length));
    var firmasTx=function(i){ return (i.prod && i.sst) ? t('Con sus tres firmas.') : ((!i.prod && !i.sst) ? t('Faltan las firmas de Producción y de SST.') : (i.prod ? t('Falta la firma de SST.') : t('Falta la firma de Producción.'))); };
    if(j.estado==='baja'){ cls='baja'; est='<b>'+esc(t('DADO DE BAJA'))+'</b><span>'+esc(t('Ya no se usa en la obra.'))+'</span>'; }
    else if(j.estado==='fuera'){ cls='mal'; est='<b>'+esc(t('FUERA DE SERVICIO'))+'</b><span>'+esc(t('No lo uses.'))+(obs ? ' '+obs : '')+'</span>'; }
    else if(diaria && ih && ih.r==='observado'){ cls='ojo'; est='<b>'+esc(t('CON OBSERVACIÓN'))+'</b><span>'+esc(ih.h ? t('Inspeccionado hoy a las {0}.', ih.h) : t('Inspeccionado hoy.'))+' '+esc(t('Consulta con tu supervisor antes de usarlo.'))+'</span>'; }
    else if(diaria && ih){ cls='ok'; est='<b>'+esc(t('INSPECCIONADO HOY'))+'</b><span>'+esc(ih.h ? t('A las {0}.', ih.h) : t('Inspeccionado hoy.'))+'</span>'; }
    else if(diaria){ cls='ojo'; est='<b>'+esc(t('HOY SIN INSPECCIÓN'))+'</b><span>'+esc(t('Inspecciónalo antes de usarlo.'))+'</span>'; }
    else if(u.r==='observado'){ cls='ojo'; est='<b>'+esc(t('CON OBSERVACIÓN'))+'</b><span>'+(obs ? obs+' ' : '')+esc(t('Consulta con tu supervisor antes de usarlo.'))+'</span>'; }
    else if(alDia){ cls='ok'; est='<b>'+esc(t('AL DÍA'))+'</b><span>'+esc(t('Revisado el {0}.', fecha(u.f)))+'</span>'; }
    else { cls='ojo'; est='<b>'+esc(t('LE TOCA REVISIÓN'))+'</b><span>'+esc(u.f ? t('La última fue el {0}.', fecha(u.f)) : t('Todavía no tiene ninguna revisión.'))+'</span>'; }
    var h='<div class="estado '+cls+'" id="estado">'+est+'</div>';
    h+='<div class="eq"><span class="cod">'+esc(j.codigo)+'</span><span class="tipo">'+esc(tipo(j.tipo))+'</span>'+(j.detalle ? '<span class="det">'+esc(j.detalle)+'</span>' : '')+'</div>';
    if(ih && j.estado!=='baja'){
      var RR={conforme:['Conforme','r-ok'], observado:['Con observación','r-ojo'], no_apto:['No apto','r-mal']}[ih.r] || [String(ih.r||''),''];
      h+='<div class="tarj" id="insp-hoy"><h2>'+esc(t('La inspección de hoy'))+'</h2><div class="hist"><div><span>'+esc(ih.h||'')+'</span><span class="'+RR[1]+'">'+esc(t(RR[0]))+'</span></div></div>'+
         '<p class="firmas '+((ih.prod && ih.sst) ? 'ok' : 'falta')+'">'+esc(firmasTx(ih))+'</p>'+
         (ih.n>1 ? '<p style="margin:6px 0 0">'+esc(t('{0} inspecciones hoy.', ih.n))+'</p>' : '')+'</div>';
    }
    if(j.color_mes || u.c){
      h+='<div class="tarj"><h2>'+esc(t('La cinta'))+'</h2>';
      if(j.color_mes) h+='<div class="cinta">'+(function(){ var c=color(j.color_mes); return c ? '<i style="background:'+c[1]+'"></i>' : ''; })()+
        '<span>'+esc(t('{0} es el color de {1}.', nomColor(j.color_mes), nomMes))+'</span></div>';
      if(u.c && alDia && j.color_mes && String(u.c).toLowerCase()!==String(j.color_mes).toLowerCase())
        h+='<p style="margin:8px 0 0">'+esc(t('En la revisión le pusieron la {0}.', cintaDe(u.c)))+'</p>';
      h+='</div>';
    }
    var cont=Array.isArray(j.contenido) ? j.contenido.filter(function(x){ return x && String(x).trim(); }) : [];
    if(cont.length) h+='<div class="tarj"><h2>'+esc(t('Lo que tiene'))+'</h2><ul>'+cont.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join('')+'</ul></div>';
    var hist=Array.isArray(j.hist) ? j.hist : [];
    if(hist.length){
      var R={conforme:['Conforme','r-ok'], observado:['Con observación','r-ojo'], fuera:['Fuera de servicio','r-mal']};
      h+='<div class="tarj"><h2>'+esc(t('Las últimas revisiones'))+'</h2><div class="hist">'+hist.map(function(x){
        var r=R[x.r]||[x.r,''];
        return '<div><span>'+esc(fecha(x.f))+(x.c ? ' · '+esc(cintaDe(x.c)) : '')+'</span><span class="'+r[1]+'">'+esc(t(r[0]))+'</span></div>';
      }).join('')+'</div></div>';
    }
    if(j.estado!=='baja'){
      h+='<a class="btn" href="../?equipo='+encodeURIComponent(tk)+'">'+esc(t('Inspeccionarlo en OBRASST'))+'</a>';
      h+='<p class="nota">'+esc(t('La inspección se hace en la app: checklist, fotos y firma.'))+'</p>';
    }
    cuerpo.innerHTML=h;
  }).catch(function(){
    di('Sin internet', 'Necesitas señal para ver este equipo. Vuelve a escanear la etiqueta cuando tengas datos o wifi.');
  });
})();
</script>
</body></html>
