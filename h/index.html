    else if(FR && !(conMes && u.r==='observado')){
      if(otras.some(function(x){ return x.r==='observado'; })){ cls='ojo'; fst='obs'; est='<b>'+esc(t('CON OBSERVACIÓN'))+'</b><span>'+esc(t('Su última inspección salió con observación.'))+' '+esc(t('Consulta con tu supervisor antes de usarlo.'))+'</span>'; }
      else if(faltaQR.length){ cls='ojo'; fst='pend'; est='<b>'+esc(t(FALTA_T[faltaQR.join(',')] || FALTA_T[faltaQR[0]]))+otrasTx(faltaQR)+'</b>'; }
      else if(QR.length){
        /* la de su QR, al día: hecha el … y hasta cuándo vale; si le toca otra (la anual…), se dice */
        var cq=QR[0], xq=rvDe(cq) || {}, pend=tocaTx(QR);
        cls=pend ? 'ojo' : 'ok'; fst=(xq.r==='observado' || (j.insp && j.insp.r==='observado' && j.insp.f===xq.f)) ? 'obs' : 'ok'; if(fst==='obs') cls='ojo';
        est='<b>'+esc(t(cq==='semanal' ? 'INSPECCIONADO ESTA SEMANA' : 'INSPECCIONADO ESTE MES'))+otrasTx([cq])+'</b><span>'+esc(t('Hecha el {0} · vale hasta el {1}.', fecha(xq.f), fecha(xq.hasta)))+pend+'</span>';
      }
      else if(otras.length && otras.every(function(x){ return x.al_dia; })){ cls='ok'; fst='ok'; est='<b>'+esc(t('AL DÍA'))+'</b><span>'+esc(t('Sus inspecciones están al día.'))+'</span>'; }
      else { cls='ojo'; est='<b>'+esc(t('LE TOCA REVISIÓN'))+'</b><span>'+esc(t('Le toca: {0}.', otras.filter(function(x){ return !x.al_dia; }).map(function(x){ return t(FREC_N[x.q] || x.q).toLowerCase(); }).join(', ')))+'</span>'; }
    }
    else if(u.r==='observado'){ cls='ojo'; fst='obs'; est='<b>'+esc(t('CON OBSERVACIÓN'))+'</b><span>'+(obs ? obs+' ' : '')+esc(t('Consulta con tu supervisor antes de usarlo.'))+'</span>'; }
    else if(alDia){ cls='ok'; fst='ok'; est='<b>'+esc(t('AL DÍA'))+'</b><span>'+esc(t('Revisado el {0}.', fecha(u.f)))+'</span>'; }
    else { cls='ojo'; est='<b>'+esc(t('LE TOCA REVISIÓN'))+'</b><span>'+esc(u.f ? t('La última fue el {0}.', fecha(u.f)) : t('Todavía no tiene ninguna revisión.'))+'</span>'; }
    /* V7.3 · debajo del estado, la recarga del extintor si venció o vence en 15 días */
    /* 4/11/2026 · V7.9j · la ficha de la inspección (con el estado, la recarga y el equipo adentro) */
    var h=fichaHtml(j, cls, est, fst, u, ih, FR);
    /* V7.3 · Gemini y Copilot: como en la app, el estado, la cinta de este mes y cómo usarlo */
    if(conMes && (j.color_mes || u.c)){
      h+='<div class="tarj" id="cinta"><h2>'+esc(t('La cinta de este mes'))+'</h2>';
      if(j.color_mes) h+='<div class="cinta">'+(function(){ var c=color(j.color_mes); return c ? '<i style="background:'+c[1]+'"></i>' : ''; })()+
        '<span>'+esc(t('{0} es el color de {1}.', nomColor(j.color_mes), nomMes))+'</span></div>';
      if(u.c && alDia && j.color_mes && String(u.c).toLowerCase()!==String(j.color_mes).toLowerCase())
        h+='<p style="margin:8px 0 0">'+esc(t('En la revisión le pusieron la {0}.', cintaDe(u.c)))+'</p>';
      h+='</div>';
    }
    /* 14/10/2026 · cómo usarlo, arriba (en una emergencia es lo que se busca); no si está fuera de servicio o de baja */
    if(j.estado!=='baja' && j.estado!=='fuera') h+=usoHtml(j)+paraHtml(j);
    if(ih && j.estado!=='baja' && !(j.insp && typeof j.insp==='object')){
      var RR={conforme:['Conforme','r-ok'], observado:['Con observación','r-ojo'], no_apto:['No apto','r-mal']}[ih.r] || [String(ih.r||''),''];
      h+='<div class="tarj" id="insp-hoy"><h2>'+esc(t('La inspección de hoy'))+'</h2><div class="hist"><div><span>'+esc(ih.h||'')+'</span><span class="'+RR[1]+'">'+esc(t(RR[0]))+'</span></div></div>'+
         '<p class="firmas '+((ih.prod && ih.sst) ? 'ok' : 'falta')+'">'+esc(firmasTx(ih))+'</p>'+
         (ih.n>1 ? '<p style="margin:6px 0 0">'+esc(t('{0} inspecciones hoy.', ih.n))+'</p>' : '')+'</div>';
    }
    if(FR && RV.length && j.estado!=='baja') h+=frecHtml(RV, FREC_N);
    var cont=Array.isArray(j.contenido) ? j.contenido.filter(function(x){ return x && String(x).trim(); }) : [];
    if(cont.length) h+='<div class="tarj"><h2>'+esc(t('Lo que tiene'))+'</h2><ul>'+cont.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join('')+'</ul></div>';
    var hist=Array.isArray(j.hist) ? j.hist : [];
    if(hist.length && conMes){
      var R={conforme:['Conforme','r-ok'], observado:['Con observación','r-ojo'], fuera:['Fuera de servicio','r-mal']};
      h+='<div class="tarj"><h2>'+esc(t('Las últimas revisiones'))+'</h2><div class="hist">'+hist.map(function(x){
        var r=R[x.r]||[x.r,''];
        return '<div><span>'+esc(fecha(x.f))+(x.c ? ' · '+esc(cintaDe(x.c)) : '')+'</span><span class="'+r[1]+'">'+esc(t(r[0]))+'</span></div>';
      }).join('')+'</div></div>';
    }
    /* 4/11/2026 · V7.9j · Marcelo: «si alguien externo escanea el QR, le sale igual? … solo el que es supervisor sst, o parte del
       equipo SSOMA o si es que el usuario escoge, brigadistas también». La regla de la obra (quien.r; sin el SQL, como antes): */
    if(j.estado!=='baja'){
      var QN=(j.quien && typeof j.quien==='object') ? j.quien : {}, rg=String(QN.r||''), ir='../?equipo='+encodeURIComponent(tk);
      var HAB={emergencia:'los brigadistas', altura:'los habilitados en trabajo en altura', izaje:'los habilitados en izaje y maniobras', equipos:'los operadores habilitados'};
      if(rg==='equipo'){
        h+='<div class="tarj quien" id="quien"><h2>'+esc(t('Quién lo inspecciona'))+'</h2><p class="q-cand">🔒 '+esc(t('Solo el equipo de SST de la obra inspecciona este equipo.'))+'</p>'+
           '<p style="margin:0">'+esc(t('Si ves algo mal (le falta algo, está golpeado, sin presión o sin carga), avísale a tu supervisor.'))+'</p>'+
           '<a class="btn sec" id="btn-insp" href="'+ir+'">'+esc(t('Soy del equipo de SST: inspeccionarlo'))+'</a></div>';
      } else {
        if(rg==='habilitados') h+='<div class="tarj quien" id="quien"><h2>'+esc(t('Quién lo inspecciona'))+'</h2><p style="margin:0">'+
           esc(t('Lo inspeccionan el equipo de SST de la obra y {0}, con su credencial vigente.', t(HAB[QN.c] || 'los operadores habilitados')))+'</p></div>';
        h+='<a class="btn" id="btn-insp" href="'+ir+'">'+esc(t('Inspeccionarlo en OBRASST'))+'</a>';
        h+='<p class="nota">'+esc(t('La inspección se hace en la app: checklist, fotos y firma.'))+'</p>';
      }
    }
    cuerpo.innerHTML=h;
    try{ var mc=document.querySelector('.caja > .marca'); if(mc) mc.hidden=!!document.getElementById('ficha'); }catch(_m){}
    var bc=document.getElementById('f-cert-b'); if(bc) bc.onclick=verCerts;   /* V7.9k */
    var bi=document.getElementById('f-imprimir'); if(bi) bi.onclick=function(){ try{ var d=document.getElementById('f-todos'); if(d) d.open=true; window.print(); }catch(_p){} };
    /* 13/10/2026 · con candados puestos (bloqueo y etiquetado): BLOQUEADO, por encima de todo lo demás. Sin nombres:
       esta página la abre cualquiera que escanee el QR. */
    if(j.estado!=='baja') fetch(SB+'/rest/v1/rpc/sst_bloqueo_ver', { method:'POST', credentials:'omit',
        headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'}, body:JSON.stringify({p_t:tk}) })
      .then(function(r){ return r.ok ? r.json() : null; }).then(function(b){
        var l=(b && b.ok && Array.isArray(b.bloqueos)) ? b.bloqueos : [];
        if(!l.length) return;
        var EN={electrica:['⚡','Eléctrica'], mecanica:['⚙️','Mecánica'], hidraulica:['💧','Hidráulica'], neumatica:['💨','Neumática'],
                termica:['🔥','Térmica'], quimica:['🧪','Química'], gravedad:['⬇️','Por gravedad'], otra:['❔','Otra']};
        var es=document.getElementById('estado');
        if(es){ es.className='estado bloq'; es.innerHTML='<b>🔒 '+esc(t('BLOQUEADO'))+'</b><span>'+esc(l.length===1 ? t('No lo uses ni lo enciendas: tiene un candado puesto.') : t('No lo uses ni lo enciendas: tiene {0} candados puestos.', l.length))+'</span>'; }
        var hh='<div class="tarj" id="bloqueos"><h2>'+esc(t('Los candados'))+'</h2><div class="hist">'+l.map(function(x){
          var d=new Date(x.desde), hora=isNaN(d) ? '' : ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
          return '<div><span>'+(x.energia||[]).map(function(k){ var e=EN[k]||['','']; return e[0]+' '+esc(t(e[1])); }).join(' · ')+'</span>'+
                 '<span>'+(x.candado ? esc(t('Candado {0}', x.candado))+' · ' : '')+esc(t('desde las {0}', hora))+'</span></div>';
        }).join('')+'</div><p class="firmas falta" style="margin-top:10px">'+esc(t('Solo quien puso su candado lo quita.'))+'</p></div>';
        var se=document.getElementById('sello'); if(se){ se.className='sello bloq'; se.innerHTML='<i>🔒</i><b>'+esc(t('BLOQUEADO'))+'</b>'; }   /* V7.9j */
        var eq=document.getElementById('ficha') || cuerpo.querySelector('.eq'); if(eq) eq.insertAdjacentHTML('afterend', hh);
      }, function(){});
  }).catch(function(){
    di('Sin internet', 'Necesitas señal para ver este equipo. Vuelve a escanear la etiqueta cuando tengas datos o wifi.');
  });
})();
</script>
</body></html>
