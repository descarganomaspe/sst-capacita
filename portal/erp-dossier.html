<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dossier de calidad · OBRASST</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{ --fondo:#F4F6F8; --panel:#fff; --raya:#E3E8EC; --tinta:#0B2A3A; --texto:#22323D; --gris:#62737F; --casco:#F5B700; --ok:#1E8E5A; --ok-f:#E8F5EE; --mal:#C6323A; --mal-f:#FBE9EA; --ojo-f:#FBF3E4;
  --f:'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; --mono:'IBM Plex Mono', ui-monospace, Menlo, monospace; }
*{box-sizing:border-box} body{margin:0; background:var(--fondo); color:var(--texto); font:15px/1.55 var(--f); -webkit-font-smoothing:antialiased}
.barra{background:var(--tinta); color:#fff; padding:14px 16px; display:flex; gap:10px; align-items:center} .barra b{letter-spacing:.05em} .barra i{display:inline-block; width:14px; height:4px; background:var(--casco); border-radius:2px}
main{max-width:860px; margin:0 auto; padding:20px 16px 50px} h1{font-size:22px; color:var(--tinta); margin:0 0 4px} .gris{color:var(--gris); font-size:13.5px}
.tarj{background:var(--panel); border:1px solid var(--raya); border-radius:12px; padding:16px; margin:14px 0} .tarj h2{font-size:15.5px; color:var(--tinta); margin:0 0 8px}
.tabla{overflow-x:auto} table{width:100%; border-collapse:collapse; font-size:14px} th{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--gris); text-align:left; padding:7px 8px; border-bottom:1px solid var(--raya)}
td{padding:8px; border-bottom:1px solid #EEF2F5; vertical-align:top} .mono{font-family:var(--mono)} .num{text-align:right}
.pill{display:inline-block; font-size:11.5px; font-weight:600; padding:3px 8px; border-radius:999px} .ok{background:var(--ok-f); color:var(--ok)} .mal{background:var(--mal-f); color:var(--mal)}
.aviso{background:var(--ojo-f); border:1px solid #EED9A8; border-radius:10px; padding:10px 12px; font-size:13.5px} a.bt{display:inline-block; background:var(--tinta); color:#fff; text-decoration:none; padding:8px 12px; border-radius:8px; font-size:13.5px; font-weight:600}
</style>
</head>
<body>
<header class="barra"><i></i><b>OBRASST</b><span style="color:#9FB6C4">Dossier de calidad</span></header>
<main id="m"><p class="gris">Cargando el dossier…</p></main>
<script src="erp-dossier.js?v=erp1"></script>
</body>
