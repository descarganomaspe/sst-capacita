/* 2/11/2026 · V7 · la página pública de un aliado (obrasstapp.com/a/CODIGO): solo si él la publica y su plan la trae. Lo que vende

:root{ --petroleo:#0B2A3A; --petroleo3:#1B4B63; --casco:#F5B700; --papel:#fff; --mesa:#F4F6F8; --raya:#E1E7EC; --raya2:#C9D3DA;
  --texto:#22323D; --gris:#5E717E; --ok:#1C8A55; --ok-f:#E6F4EC; --f:'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
*{box-sizing:border-box} body{margin:0; background:var(--mesa); color:var(--texto); font:16px/1.6 var(--f); -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0; color:var(--petroleo); font-weight:600; letter-spacing:-.015em; text-wrap:balance} p{margin:0} a{color:var(--petroleo)}
:focus-visible{outline:2px solid var(--casco); outline-offset:3px; border-radius:4px}
.ancho{max-width:880px; margin:0 auto; padding-inline:20px}
.barra{background:var(--petroleo)} .barra .ancho{display:flex; align-items:center; gap:12px; min-height:58px}
.marca{display:flex; align-items:center; gap:10px; text-decoration:none; color:#fff} .marca-ic{width:30px; height:30px; border-radius:8px; background:var(--petroleo3); display:grid; place-items:center}
.marca-ic i{display:block; width:14px; height:4px; background:var(--casco); border-radius:2px} .marca b{font-size:15px; letter-spacing:.05em} .marca span{color:#9FB6C4; font-size:13.5px}
.portada{background:var(--petroleo); color:#D5E2EA; padding-block:30px 36px}
.cab{display:flex; gap:18px; align-items:center; flex-wrap:wrap} .logo{width:76px; height:76px; border-radius:14px; background:#fff; object-fit:contain; padding:6px; flex:none}
.cab h1{color:#fff; font-size:clamp(24px, 4vw, 34px); line-height:1.15} .rub{color:var(--casco); font-size:12.5px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; margin-bottom:6px}
.sello{display:inline-flex; gap:6px; align-items:center; margin-top:10px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18); color:#fff; border-radius:999px; padding:4px 12px; font-size:13.5px}
.sello i{width:16px; height:16px; border-radius:50%; background:var(--ok); display:grid; place-items:center; font-style:normal; font-size:11px; color:#fff}
main{padding-block:22px 40px} .tarj{background:var(--papel); border:1px solid var(--raya); border-radius:14px; padding:18px; margin-bottom:14px} .tarj h2{font-size:17px; margin-bottom:10px}
dl{display:grid; grid-template-columns:minmax(110px, max-content) minmax(0, 1fr); gap:8px 16px; margin:0} dt{color:var(--gris); font-size:14px} dd{margin:0; overflow-wrap:anywhere}
.vende{white-space:pre-line} ul.hace{margin:0; padding-left:20px} ul.hace li{margin:3px 0} ul.hace small{color:var(--gris)}
.bts{display:flex; gap:10px; flex-wrap:wrap; margin-top:4px}
.bt{display:inline-flex; align-items:center; justify-content:center; min-height:46px; padding:0 18px; border-radius:10px; font:600 15px/1 var(--f); text-decoration:none; border:1px solid transparent}
.bt.casco{background:var(--casco); color:var(--petroleo)} .bt.linea{background:#fff; color:var(--petroleo); border-color:var(--raya2)}
.gris{color:var(--gris)} .chico{font-size:13.5px} .pie{color:var(--gris); font-size:13px; padding-block:6px 30px}
@media (max-width:520px){ dl{grid-template-columns:minmax(0, 1fr)} dt{margin-top:4px} .bt{flex:1 1 100%} }
</style>
