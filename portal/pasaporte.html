<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Historial del trabajador · OBRASST</title>
<meta name="description" content="El historial de un trabajador: sus capacitaciones, la vigencia de su EMO y de su SCTR, y sus habilitaciones.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--petroleo:#0B2A3A;--petroleo3:#1B4B63;--casco:#F5B700;--papel:#fff;--mesa:#F4F6F8;--raya:#E1E7EC;--raya2:#C9D3DA;--texto:#22323D;--gris:#5E717E;--ok:#1C8A55;--ok-f:#E6F4EC;--ojo:#9A5B00;--ojo-f:#FBF1E0;--mal:#C23A40;--mal-f:#FBE8E9;
  --f:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box} body{margin:0;background:var(--mesa);color:var(--texto);font:16px/1.6 var(--f);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;color:var(--petroleo);font-weight:600;letter-spacing:-.015em;text-wrap:balance} p{margin:0} a{color:var(--petroleo)}
:focus-visible{outline:2px solid var(--casco);outline-offset:3px;border-radius:4px}
.ancho{max-width:1040px;margin:0 auto;padding-inline:20px}
.barra{background:var(--petroleo)} .barra .ancho{display:flex;align-items:center;gap:14px;min-height:60px}
.marca{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff} .marca-ic{width:32px;height:32px;border-radius:9px;background:var(--petroleo3);display:grid;place-items:center}
.marca-ic i{display:block;width:15px;height:4px;background:var(--casco);border-radius:2px} .marca b{font-size:15px;letter-spacing:.05em}
.barra nav{margin-left:auto;display:flex;gap:16px;flex-wrap:wrap} .barra nav a{color:#C8D7E0;text-decoration:none;font-size:14px}
.portada{background:var(--petroleo);color:#D5E2EA;padding-block:44px 52px} .portada h1{color:#fff;font-size:clamp(28px,4.2vw,44px);line-height:1.08}
.portada p{margin-top:14px;font-size:18px;max-width:40em} .ceja{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--casco);margin-bottom:12px}
.sec{padding-block:36px} .tarj{background:var(--papel);border:1px solid var(--raya);border-radius:16px;padding:20px}
.bt{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:10px;font:600 15px/1 var(--f);text-decoration:none;cursor:pointer;border:1px solid transparent}
.bt.casco{background:var(--casco);color:var(--petroleo)} .bt.tinta{background:var(--petroleo);color:#fff} .bt.wa{background:#1F7A4D;color:#fff} .bt.linea{background:#fff;color:var(--petroleo);border-color:var(--raya2)}
.gris{color:var(--gris)} .chico{font-size:13px}
.pie{padding-block:28px;color:var(--gris);font-size:13px}
</style>
<style>
.pas{max-width:560px;margin:24px auto} .pas h1{font-size:26px} .doc{color:var(--gris);margin-top:4px}
.emp{margin-top:16px} .emp h2{font-size:17px;margin:0 0 8px} .it{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--raya)}
.it:last-child{border-bottom:0} .pt{width:10px;height:10px;border-radius:50%;flex:none;background:var(--ok)} .pt.ojo{background:var(--ojo)} .pt.mal{background:var(--mal)} .it small{color:var(--gris);margin-left:auto;white-space:nowrap}
</style>
</head>
<body>
<header class="barra"><div class="ancho"><a class="marca" href="index.html"><span class="marca-ic"><i></i></span><b>OBRASST</b></a><nav><a href="index.html#os-pasaporte">¿Qué es el historial del trabajador?</a></nav></div></header>
<main class="ancho"><div class="pas"><div class="tarj" id="p" aria-live="polite"><p class="gris">Cargando el historial…</p></div>
<p class="gris chico" id="p-nota" style="margin-top:10px"></p></div></main>
<footer class="pie"><div class="ancho">OBRASST · <a href="index.html">obrasstapp.com</a> · <a href="mailto:info@obrasstapp.com">info@obrasstapp.com</a> · <a href="https://descarganomaspe.github.io/sst-capacita/?legal=terminos" target="_blank" rel="noopener">Términos</a> · <a href="https://descarganomaspe.github.io/sst-capacita/?legal=privacidad" target="_blank" rel="noopener">Privacidad</a> · <a href="index.html#libro">Libro de Reclamaciones</a></div></footer>
<script>
var SB = { url:'https://gwjjkknuiumgysezeatz.supabase.co', key:'sb_publishable_7fLOMEbxMHW9ButihszpoQ_gkfNKnnx' };
(function(){
  var c = document.getElementById('p'), k = (/[?&]k=([0-9a-f]{32})(&|$)/.exec(location.search) || [])[1];
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(x){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[x]; }); }
  function f(d){ if(!d) return ''; var p = String(d).slice(0, 10).split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : esc(d); }
  var E = { ok:['', 'vigente'], vence:['ojo', 'vence pronto'], ven:['mal', 'vencido'], sin:['mal', 'sin registro'] };
  function it(t, est, hasta){ var e = E[est] || ['', '']; return '<div class="it"><i class="pt ' + e[0] + '"></i><span>' + esc(t) + ' · ' + e[1] + '</span>' + (hasta ? '<small>hasta ' + f(hasta) + '</small>' : '') + '</div>'; }
  if(!k){ c.innerHTML = '<h1>Enlace no válido</h1><p class="gris">Escanea otra vez el QR del trabajador.</p>'; return; }
  fetch(SB.url + '/rest/v1/rpc/os_pasaporte_ver', { method:'POST', headers:{ apikey:SB.key, Authorization:'Bearer ' + SB.key, 'Content-Type':'application/json' }, body:JSON.stringify({ p_k:k }) })
    .then(function(r){ return r.json(); }).then(function(d){
      if(!d || !d.ok){ c.innerHTML = '<h1>Este historial no está disponible</h1><p class="gris">Pudo revocarse. Consulta a la empresa del trabajador.</p>'; return; }
      c.innerHTML = '<p class="ceja" style="color:var(--gris)">Historial del trabajador · ' + f(d.hoy) + '</p><h1>' + esc(d.nombre) + '</h1><p class="doc">Documento ' + esc(d.doc) + '</p>' +
        (d.empresas || []).map(function(e){ return '<div class="emp"><h2>' + esc(e.empresa) + (e.puesto ? ' · <span class="gris" style="font-weight:400">' + esc(e.puesto) + '</span>' : '') + '</h2>' +
          (e.capacitaciones || []).map(function(x){ return it(x.tema, 'ok', x.vence); }).join('') +
          (e.emo ? it('Examen médico ocupacional', e.emo.estado, e.emo.hasta) : '') + (e.sctr ? it('SCTR salud y pensión', e.sctr.estado, e.sctr.hasta) : '') +
          (e.habilitaciones || []).map(function(h){ return it('Habilitado: ' + h, 'ok'); }).join('') +
          (!(e.capacitaciones || []).length && !e.emo && !e.sctr && !(e.habilitaciones || []).length ? '<p class="gris">Sin registros vigentes en esta empresa.</p>' : '') + '</div>'; }).join('');
      document.getElementById('p-nota').textContent = d.nota || '';
    }, function(){ c.innerHTML = '<h1>Sin conexión</h1><p class="gris">Revisa tu internet y vuelve a escanear.</p>'; });
})();
</script>
</body>
</html>
