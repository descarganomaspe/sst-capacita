  function hora(iso){ var d=new Date(iso); return isNaN(d) ? '' : ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }
  function fecha(iso){ var d=new Date(iso); return isNaN(d) ? '' : ('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+'/'+d.getFullYear(); }
  function guardado(){ try{ var g=JSON.parse(localStorage.getItem(LS)||'null'); return (g && g.t===tk && g.pase && hoyL(new Date(g.entra))===hoyL()) ? g : null; }catch(_e){ return null; } }
  function guardar(g){ try{ localStorage.setItem(LS, JSON.stringify(g)); }catch(_e){} }
  function pasos(n){ var h='<div class="pasos" aria-hidden="true">'; for(var i=1;i<=3;i++) h+='<i'+(i<=n?' class="on"':'')+'></i>'; return h+'</div>'; }

  function pintar(){
    var h='';
    if(S.paso===1){
      h+=pasos(1)+'<h1>'+esc(t('Bienvenido a la obra'))+'</h1><p class="sub">'+esc(t('Antes de entrar: tus datos, las reglas y tres preguntas. Dos minutos.'))+'</p>';
      h+='<div class="tarj">'+
        '<label for="v-nombre">'+esc(t('Nombre y apellidos'))+'</label><input type="text" id="v-nombre" autocomplete="name" maxlength="80" value="'+esc(S.d.nombre)+'">'+
        '<label for="v-doc">'+esc(t('Documento de identidad'))+'</label><input type="text" id="v-doc" inputmode="text" autocomplete="off" maxlength="20" value="'+esc(S.d.doc)+'">'+
        '<label for="v-de">'+esc(t('¿De qué empresa vienes?'))+'</label><input type="text" id="v-de" maxlength="80" value="'+esc(S.d.de)+'">'+
        '<label for="v-a">'+esc(t('¿A quién visitas?'))+'</label><input type="text" id="v-a" maxlength="80" value="'+esc(S.d.visita_a)+'">'+
        '<label for="v-cel">'+esc(t('Tu celular'))+' <span class="opc">'+esc(t('(si quieres)'))+'</span></label><input type="tel" id="v-cel" autocomplete="tel" maxlength="20" value="'+esc(S.d.celular)+'">'+
        '</div><p class="msg" id="v-msg"></p><button type="button" class="btn" id="v-sig1">'+esc(t('Siguiente'))+'</button>';
      cuerpo.innerHTML=h;
      document.getElementById('v-sig1').onclick=function(){
        S.d.nombre=document.getElementById('v-nombre').value.trim().replace(/\s+/g,' ');
        S.d.doc=document.getElementById('v-doc').value.trim();
        S.d.de=document.getElementById('v-de').value.trim();
        S.d.visita_a=document.getElementById('v-a').value.trim();
        S.d.celular=document.getElementById('v-cel').value.trim();
        var m=document.getElementById('v-msg');
        if(S.d.nombre.length<3){ m.textContent=t('Escribe tu nombre y apellidos.'); return; }
        if(S.d.doc.replace(/[^0-9A-Za-z]/g,'').length<4){ m.textContent=t('Escribe tu documento.'); return; }
        S.paso=2; pintar(); window.scrollTo(0,0);
      };
      return;
    }
    if(S.paso===2){
      h+=pasos(2)+'<h1>'+esc(t('Las reglas de la obra'))+'</h1>';
      h+='<div class="reglas">'+REGLAS.map(function(r){ return '<div class="regla"><span class="ic" aria-hidden="true">'+r[0]+'</span><span>'+esc(t(r[1]))+'</span></div>'; }).join('');
      (S.reglas||[]).forEach(function(r){ h+='<div class="regla propia"><span class="ic" aria-hidden="true">📌</span><span>'+esc(r)+'</span></div>'; });
      h+='</div><button type="button" class="btn" id="v-sig2">'+esc(t('Las leí'))+'</button><button type="button" class="btn sec" id="v-atr2">'+esc(t('Atrás'))+'</button>';
      cuerpo.innerHTML=h;
      document.getElementById('v-sig2').onclick=function(){ S.paso=3; pintar(); window.scrollTo(0,0); };
      document.getElementById('v-atr2').onclick=function(){ S.paso=1; pintar(); };
      return;
    }
    if(S.paso===3){
      var todas=PREG.every(function(p, i){ return S.resp[i]==='b'; });
      h+=pasos(3)+'<h1>'+esc(t('Tres preguntas'))+'</h1>';
      PREG.forEach(function(p, i){
        var r=S.resp[i];
        h+='<div class="preg"><div class="q"><span class="ic" aria-hidden="true">'+p.ic+'</span><span>'+esc(t(p.q))+'</span></div>';
        p.o.forEach(function(o){
          var cl=(r===o[0]) ? (o[0]==='b' ? ' bien' : ' mal') : '';
          h+='<button type="button" class="op'+cl+'" data-p="'+i+'" data-o="'+o[0]+'">'+esc(t(o[1]))+'</button>';
        });
        if(r && r!=='b') h+='<p class="no">'+esc(t('Esa no. Mira la regla otra vez:'))+' '+REGLAS[p.r][0]+' '+esc(t(REGLAS[p.r][1]))+'</p>';
        h+='</div>';
      });
      h+='<label class="acepto"><input type="checkbox" id="v-acepto"'+(S.acepto?' checked':'')+'><span>'+esc(t('Acepto que esta obra guarde mis datos para el control de visitas y para saber quién está adentro en una emergencia. Se guardan 6 meses.'))+'</span></label>';
      h+='<p class="msg" id="v-msg"></p><button type="button" class="btn" id="v-entrar"'+((todas && S.acepto && !S.enviando)?'':' disabled')+'>'+esc(t(S.enviando ? 'Entrando…' : 'Entrar'))+'</button>'+
         '<button type="button" class="btn sec" id="v-atr3">'+esc(t('Ver las reglas'))+'</button>';
      cuerpo.innerHTML=h;
      [].slice.call(cuerpo.querySelectorAll('.op')).forEach(function(b){ b.onclick=function(){ S.resp[+b.getAttribute('data-p')]=b.getAttribute('data-o'); pintar(); }; });
      document.getElementById('v-acepto').onchange=function(){ S.acepto=this.checked; pintar(); };
      document.getElementById('v-atr3').onclick=function(){ S.paso=2; pintar(); window.scrollTo(0,0); };
      document.getElementById('v-entrar').onclick=entrar;
      return;
    }
  }
  function entrar(){
    if(S.enviando) return;
    S.enviando=true; pintar();
    rpc('sst_visita_entrar', { p_t:tk, p:{ nombre:S.d.nombre, doc:S.d.doc, de:S.d.de, visita_a:S.d.visita_a, celular:S.d.celular, acepto:true, preguntas:true } })
      .then(function(j){
        S.enviando=false; j=j||{};
        if(!j.ok){
          var m={ sin_nombre:'Escribe tu nombre y apellidos.', sin_doc:'Escribe tu documento.', muy_seguido:'Muchas visitas seguidas desde aquí. Espera un momento y vuelve a intentar.',
                  no_existe:'Este QR ya no está activo. Pide en la puerta el QR nuevo.' }[j.motivo] || 'No se pudo registrar. Vuelve a intentar.';
          pintar(); var e=document.getElementById('v-msg'); if(e) e.textContent=t(m); return;
        }
        var g={ t:tk, pase:j.pase, nombre:S.d.nombre, de:S.d.de, a:S.d.visita_a, entra:j.entra || new Date().toISOString(), obra:j.obra || S.obra, sale:null };
        guardar(g); verPase(g); window.scrollTo(0,0);
      }, function(){
        S.enviando=false; pintar();
        var e=document.getElementById('v-msg'); if(e) e.textContent=t('Sin señal: no se pudo registrar. Vuelve a intentar.');
      });
  }
  function verPase(g){
    if(g.obra) pie.textContent=g.obra;
    var h='<div class="pase'+(g.sale?' cerrado':'')+'"><div class="cab">'+esc(g.sale ? t('PASE CERRADO · salió a las {0}', hora(g.sale)) : t('PASE DE VISITA · HOY'))+'</div>'+
      '<div class="cu"><div class="nom">'+esc(g.nombre)+'</div>'+
      (g.de ? '<div class="de">'+esc(g.de)+'</div>' : '')+
      (g.a ? '<div class="de">'+esc(t('Visita a:'))+' '+esc(g.a)+'</div>' : '')+
      '<div class="cod" aria-label="'+esc(t('Código del pase'))+'">'+esc(g.pase)+'</div>'+
      '<div class="hora">'+esc(t('Entró a las {0} · {1}', hora(g.entra), fecha(g.entra)))+'</div>'+
      (g.obra ? '<div class="ob">'+esc(g.obra)+'</div>' : '')+'</div></div>';
    if(!g.sale){
      h+='<div class="alarma"><span class="ic" aria-hidden="true">🚨</span><span>'+esc(t('Si suena la alarma: sigue a tu acompañante al punto de reunión.'))+'</span></div>';
      h+='<p class="nota">'+esc(t('Muestra este pase en la puerta.'))+'</p>';
      h+='<p class="msg" id="v-msg"></p><button type="button" class="btn sec" id="v-voy">👋 '+esc(t('Ya me voy'))+'</button>';
    } else h+='<p class="nota">'+esc(t('Gracias por cuidarte en la obra.'))+'</p>';
    cuerpo.innerHTML=h;
    var b=document.getElementById('v-voy');
    if(b) b.onclick=function(){
      b.disabled=true;
      rpc('sst_visita_salir', { p_t:tk, p_pase:g.pase }).then(function(j){
        if(j && j.ok){ g.sale=j.sale || new Date().toISOString(); guardar(g); verPase(g); return; }
        b.disabled=false; var e=document.getElementById('v-msg'); if(e) e.textContent=t('No se pudo marcar tu salida. Avísale a la puerta.');
      }, function(){ b.disabled=false; var e=document.getElementById('v-msg'); if(e) e.textContent=t('Sin señal: avísale a la puerta que te vas.'); });
    };
  }

  /* ── al abrir ── */
  if(!/^[0-9a-f]{20,32}$/.test(tk)){ di('Este QR está incompleto', 'Pide en la puerta que te muestren el QR de visitas de la obra.'); return; }
  var g0=guardado(); if(g0){ verPase(g0); return; }
  rpc('sst_visita_abrir', { p_t:tk }).then(function(j){
    j=j||{};
    if(!j.ok){
      if(j.motivo==='no_existe') di('Este QR ya no está activo', 'Pide en la puerta el QR nuevo.');
      else di('No se pudo abrir', 'Vuelve a escanear el QR en un momento.');
      return;
    }
    S.obra=j.obra||''; S.reglas=Array.isArray(j.reglas) ? j.reglas.slice(0, 8) : [];
    if(S.obra) pie.textContent=S.obra;
    pintar();
  }, function(){ di('No se pudo abrir', 'Sin señal. Vuelve a escanear el QR cuando tengas internet.'); });
})();
</script>
</body></html>
