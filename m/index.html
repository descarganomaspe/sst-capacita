<style>
*{box-sizing:border-box}
:root{--fondo:#0B2A3A;--tinta:#EAF2F7;--suave:#A9C2D0;--tenue:#7D97A6;--oro:#F5B700;--pizarra:#F3F5F0;--marco:#C9B48A;--papel:#FFFFFF;--osc:#0B2A3A;--gris:#5B7282}
html,body{background:var(--fondo)}
body{margin:0;min-height:100vh;color:var(--tinta);padding:20px 16px calc(24px + env(safe-area-inset-bottom,0px));
  font:16px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
.marca{font-size:12px;letter-spacing:.18em;color:var(--oro);font-weight:800;text-align:center;margin-bottom:12px}
h1{font-size:22px;line-height:1.25;margin:0;text-align:center;text-wrap:balance}
.obra{color:var(--suave);font-size:14px;text-align:center;margin:4px 0 14px}
.centro{max-width:460px;margin:0 auto;text-align:center}
.giro{width:34px;height:34px;margin:26px auto 0;border-radius:50%;border:3px solid rgba(255,255,255,.18);border-top-color:var(--oro);animation:g .8s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.giro{animation-duration:2.4s}}
.tarj{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:18px;margin-top:16px;text-align:left}
.tarj p{margin:0;color:var(--suave);font-size:15px}
a.bt,button.bt{display:block;width:100%;margin-top:14px;padding:14px;border-radius:12px;border:0;cursor:pointer;background:var(--oro);color:#0B2A3A;
  font:inherit;font-weight:800;text-align:center;text-decoration:none}
a.bt:focus-visible,button.bt:focus-visible,a.doc:focus-visible{outline:2px solid var(--oro);outline-offset:2px}
/* la pizarra: el marco de madera clara y las hojas clavadas, en fila (se corre de costado) */
.pizarra{background:var(--pizarra);border:10px solid var(--marco);border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.35), inset 0 0 0 1px rgba(0,0,0,.06);
  padding:16px 0 14px;max-width:1400px;margin:0 auto}
.fila{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px, 300px);gap:16px;overflow-x:auto;padding:4px 16px 12px;scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch}
@media (max-width:560px){ .fila{grid-auto-columns:84%} }
.hoja{scroll-snap-align:start;background:var(--papel);color:var(--osc);border-radius:6px;padding:16px 14px 12px;position:relative;
  box-shadow:0 2px 0 rgba(0,0,0,.05), 0 6px 14px rgba(0,0,0,.12);align-self:start}
.hoja:nth-child(3n+2){transform:rotate(-.6deg)} .hoja:nth-child(3n){transform:rotate(.5deg)}
@media(prefers-reduced-motion:reduce){.hoja{transform:none!important}}
.hoja::before{content:'';position:absolute;top:-7px;left:50%;width:16px;height:16px;margin-left:-8px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#ff8a7a,#C8372D 60%,#8E1E17);box-shadow:0 2px 3px rgba(0,0,0,.35)}
.hoja h2{font-size:16px;line-height:1.25;margin:2px 0 10px;text-wrap:balance}
.hoja h2 small{display:block;font-size:12px;font-weight:600;color:var(--gris);margin-top:2px}
.docs{display:grid;gap:8px}
a.doc{display:flex;gap:10px;align-items:center;padding:10px;border-radius:10px;background:#F5F8FA;border:1px solid #E1E8ED;color:var(--osc);text-decoration:none}
a.doc:hover{background:#EDF3F7}
a.doc .ic{flex:0 0 auto;width:44px;height:44px;border-radius:8px;display:grid;place-items:center;font-size:22px;background:#fff;border:1px solid #E1E8ED;overflow:hidden}
a.doc .ic img{width:100%;height:100%;object-fit:cover;display:block}
a.doc .tx{min-width:0;flex:1}
a.doc b{display:block;font-size:14px;line-height:1.3;overflow-wrap:anywhere}
a.doc small{display:block;font-size:12px;color:var(--gris);margin-top:2px}
a.doc.nuevo small b{display:inline;color:#B26A00;font-size:12px}
.ayuda{max-width:640px;margin:14px auto 0;text-align:center;color:var(--tenue);font-size:13px}
.pista{display:none;text-align:center;color:var(--gris);font-size:12.5px;margin:2px 0 0}
@media (max-width:560px){ .pista{display:block} }
[hidden]{display:none!important}
/* 14/10/2026 · el PDF de la obra se ve aquí mismo, página por página (sin descargarlo) */
body.ver{padding:0 0 calc(24px + env(safe-area-inset-bottom,0px))}
body.ver .marca{margin:14px 0 10px}
.visor{max-width:860px;margin:0 auto}
.vbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--fondo);border-bottom:1px solid rgba(255,255,255,.12)}
.vtit{flex:1;min-width:0;font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.vatras,.vbaja{flex:0 0 auto;font:inherit;font-size:14px;font-weight:800;border-radius:10px;padding:8px 12px;cursor:pointer;text-decoration:none}
.vatras{background:transparent;color:var(--tinta);border:1px solid rgba(255,255,255,.25)}
.vbaja{background:var(--oro);color:#0B2A3A;border:0}
.vatras:focus-visible,.vbaja:focus-visible{outline:2px solid var(--tinta);outline-offset:2px}
.vpags{display:grid;gap:10px;padding:12px 10px 0}
.vmsg{text-align:center;color:var(--suave);font-size:14px;margin:6px 0}
.vpags .bt{max-width:320px;margin:10px auto 0}
.vpag{position:relative;background:#fff;border-radius:4px;box-shadow:0 2px 10px rgba(0,0,0,.35);overflow:hidden;min-height:120px}
.vpag canvas{display:block;width:100%;height:auto}
.vpag .vn{position:absolute;right:8px;bottom:6px;font-size:11.5px;color:#4A5A66;background:rgba(255,255,255,.85);border-radius:6px;padding:1px 6px}

  /* ══ EL PDF SE VE AQUÍ MISMO (14/10/2026) ════════════════════════════
     Como en la página de los carteles (d/): el lector de QR del celular abre el mural en su propia ventanita,
     que no descarga archivos, y un PDF en el celular SE DESCARGA: tocarlo no llevaba a nada. Ahora el PDF de la
     obra (el de su almacén) se dibuja aquí, página por página, con «Descargar» aparte; cada página se dibuja al
     acercarse a la vista y se suelta al alejarse. Las fotos, los enlaces y lo demás, como antes. */
  var ALMACEN=SB+'/storage/v1/object/public/', PDFJS_V='6.3.289', _PDFJS=null, VIS={ doc:null, obs:null, url:null, gen:0 }, ULT=null;
  function nuestra(u){ return String(u||'').indexOf(ALMACEN)===0; }
  function esPdf(u){ return /\.pdf$/i.test(String(u||'').split('?')[0].split('#')[0]); }
  function archivoDe(u){ var n=''; try{ n=decodeURIComponent(String(u).split('#')[0].split('?')[0].split('/').pop()||''); }catch(_e){ n=''; } return n.replace(/^\d{10,}-/, '') || 'documento.pdf'; }
  function pdfjs(){
    if(_PDFJS) return _PDFJS;
    var u=function(f){ return new URL('../portal/pdfjs/'+f+'?v='+PDFJS_V, location.href).href; };
    var imp=null; try{ imp=new Function('u', 'return import(u)'); }catch(_i){ imp=null; }   /* un navegador viejo no rompe la página */
    if(!imp) return Promise.reject(new Error('sin import'));
    _PDFJS=imp(u('pdf.min.mjs')).then(function(m){
      return fetch(u('pdf.worker.min.mjs')).then(function(r){ if(!r.ok) throw new Error('worker '+r.status); return r.blob(); })
        .then(function(b){ m.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([b], { type:'text/javascript' })); return m; },
              function(){ m.GlobalWorkerOptions.workerSrc=u('pdf.worker.min.mjs'); return m; });
    });
    _PDFJS.catch(function(){ _PDFJS=null; });
    return _PDFJS;
  }
  function cerrarVisor(){
    if(VIS.obs) try{ VIS.obs.disconnect(); }catch(_o){}
    if(VIS.doc) try{ VIS.doc.destroy(); }catch(_d){}
    if(VIS.url) try{ URL.revokeObjectURL(VIS.url); }catch(_u){}
    VIS.doc=null; VIS.obs=null; VIS.url=null; VIS.gen++;
    document.body.classList.remove('ver');
  }
  function paginas(doc, gen){
    var pags=document.getElementById('v-pags'); if(!pags) return;
    var n=doc.numPages||0, ver=Math.min(n, 150);
    var h='<p class="vmsg">'+esc(n===1 ? t('1 página') : t('{0} páginas', String(n)))+'</p>';
    for(var i=1;i<=ver;i++) h+='<div class="vpag" data-p="'+i+'"><span class="vn">'+i+' / '+n+'</span></div>';
    if(n>ver) h+='<p class="vmsg">'+esc(t('Aquí se ven las primeras 150 páginas. El documento entero, con «Descargar».'))+'</p>';
    pags.innerHTML=h;
    var hojas=[].slice.call(pags.querySelectorAll('.vpag'));
    doc.getPage(1).then(function(p1){ var v=p1.getViewport({scale:1}); hojas.forEach(function(el){ if(!el.querySelector('canvas')) el.style.aspectRatio=(v.width/v.height).toFixed(4); }); }).catch(function(){});
    var pinta=function(el){
      if(el._vd) return; el._vd=1;
      doc.getPage(+el.getAttribute('data-p')).then(function(pg){
        if(gen!==VIS.gen) return;
        if(!el._quiero){ el._vd=0; return; }
        var dpr=Math.min(2, Math.max(1.5, window.devicePixelRatio||1)), ancho=el.clientWidth||pags.clientWidth||360;
        var v0=pg.getViewport({scale:1}), vp=pg.getViewport({scale:(ancho/v0.width)*dpr});
        var cv=document.createElement('canvas'); cv.width=Math.max(1, Math.floor(vp.width)); cv.height=Math.max(1, Math.floor(vp.height));
        return pg.render({canvasContext:cv.getContext('2d'), canvas:cv, viewport:vp}).promise.then(function(){
          if(gen!==VIS.gen || !el._quiero){ cv.width=0; cv.height=0; el._vd=0; return; }
          el.style.aspectRatio=(cv.width/cv.height).toFixed(4); el.insertBefore(cv, el.firstChild); el._vd=2;
        });
      }).catch(function(){ el._vd=3; });
    };
    var suelta=function(el){ var cv=el.querySelector('canvas'); if(!cv) return; el.style.aspectRatio=(cv.width/cv.height).toFixed(4); cv.width=0; cv.height=0; el.removeChild(cv); el._vd=0; };
    if('IntersectionObserver' in window){
      VIS.obs=new IntersectionObserver(function(es){ es.forEach(function(e){ var el=e.target; el._quiero=e.isIntersecting; if(e.isIntersecting) pinta(el); else if(el._vd===2) suelta(el); }); }, { rootMargin:'1200px 0px' });
      hojas.forEach(function(el){ VIS.obs.observe(el); });
    } else hojas.slice(0, 6).forEach(function(el){ el._quiero=true; pinta(el); });
  }
  function verPdf(nombre, url){
    cerrarVisor();
    var gen=VIS.gen;
    document.body.classList.add('ver');
    try{ history.pushState({ ver:1 }, ''); }catch(_h){}
    try{ window.scrollTo(0, 0); }catch(_s){}
    cuerpo.innerHTML='<div class="visor"><div class="vbar"><button type="button" class="vatras" id="v-atras">‹ '+esc(t('Volver'))+'</button>'+
      '<b class="vtit">'+esc(nombre)+'</b><a class="vbaja" id="v-baja" hidden>'+esc(t('Descargar'))+'</a></div>'+
      '<div class="vpags" id="v-pags"><p class="vmsg">'+esc(t('Trayendo el documento…'))+'</p></div></div>';
    document.getElementById('v-atras').onclick=function(){ try{ history.back(); }catch(_b){ volver(); } };
    fetch(url, { mode:'cors', credentials:'omit', referrerPolicy:'no-referrer' }).then(function(r){ return r.ok ? r.blob() : Promise.reject(r.status); }).then(function(b){
      if(gen!==VIS.gen) return;
      VIS.url=URL.createObjectURL(b);
      var bj=document.getElementById('v-baja'); if(bj){ bj.href=VIS.url; bj.setAttribute('download', archivoDe(url)); bj.hidden=false; }
      var p1=document.getElementById('v-pags'); if(p1) p1.innerHTML='<p class="vmsg">'+esc(t('Preparando el documento…'))+'</p>';
      return b.arrayBuffer().then(function(ab){ return pdfjs().then(function(lib){ return lib.getDocument({ data:new Uint8Array(ab), isEvalSupported:false }).promise; }); })
        .then(function(doc){ if(gen!==VIS.gen){ try{ doc.destroy(); }catch(_x){} return; } VIS.doc=doc; paginas(doc, gen); },
              function(){
                if(gen!==VIS.gen) return;
                /* este navegador no puede con pdf.js: el archivo, con su botón */
                var p2=document.getElementById('v-pags'); if(p2) p2.innerHTML='<p class="vmsg">'+esc(t('Este celular no pudo mostrarlo aquí.'))+'</p><a class="bt" id="v-abrir" href="'+VIS.url+'" rel="noopener">'+esc(t('Abrir el documento'))+'</a>';
              });
    }, function(){
      if(gen!==VIS.gen) return;
      var p3=document.getElementById('v-pags'); if(p3) p3.innerHTML='<p class="vmsg">'+esc(t('No se pudo traer el documento. Revisa tu señal e inténtalo otra vez.'))+'</p>'+
        '<a class="bt" id="v-abrir" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">'+esc(t('Abrir el documento'))+'</a>';
    });
  }
  function volver(){ cerrarVisor(); if(ULT) pintar(ULT); }
  try{ window.addEventListener('popstate', function(){ if(document.body.classList.contains('ver')) volver(); }); }catch(_pp){}
  cuerpo.addEventListener('click', function(ev){
    var a=(ev.target && ev.target.closest) ? ev.target.closest('a.doc') : null; if(!a) return;
    var u=a.getAttribute('href');
    if(!nuestra(u) || !esPdf(u)) return;
    ev.preventDefault();
    verPdf(a.getAttribute('data-n') || archivoDe(u), u);
  });
  function abrir(){
    if(!/^[A-Za-z0-9]{8,64}$/.test(tk)){ aviso(t('Este cartel está incompleto'), t('Al código QR le falta su ficha. Pídele a tu supervisor que vuelva a imprimir el cartel desde OBRASST.')); return; }
    cuerpo.innerHTML='<div class="centro"><h1>'+esc(t('Abriendo el mural…'))+'</h1><div class="giro"></div></div>';
    rpc('sst_mural_abrir', {p_t:tk}).then(function(r){
      if(r && r.ok===true){ pintar(r); return; }
      var e=r && r.error;
      if(e==='solo_personal'){
        aviso(t('Este mural es solo para el personal'), t('Lo ve la gente de {0} con su cuenta en la app OBRASST.', r.obra || ''),
              '<a class="bt" id="m-app" href="../?mural='+encodeURIComponent(tk)+'">'+esc(t('Ábrelo en la app'))+'</a>'+
              '<p class="ayuda">'+esc(t('Si todavía no tienes tu cuenta, pídele a tu supervisor que te registre.'))+'</p>');
        return;
      }
      if(e==='no_existe'){ aviso(t('Este cartel ya no está activo'), t('Pídele a tu supervisor el cartel nuevo del mural: se imprime desde OBRASST, en «Los QR de tu obra».')); return; }
      if(e==='sin_plan'){ aviso(t('Este mural no está activo'), t('La obra no tiene el mural en su plan.')); return; }
      aviso(t('Este cartel está incompleto'), t('Al código QR le falta su ficha. Pídele a tu supervisor que vuelva a imprimir el cartel desde OBRASST.'));
    }, function(err){
      if(err===404){ aviso(t('Periódico mural'), t('El mural todavía no está activo en el servidor. Avísale a tu supervisor.')); return; }
      aviso(t('Sin señal'), t('Necesitas datos o wifi para abrir el mural.'), '<button type="button" class="bt" id="m-otra">'+esc(t('Intentar otra vez'))+'</button>');
    });
  }
  abrir();
})();
</script>
