  var TX=/* >>> TX-E (lo pone armar.py) <<< */{"en":{"Primeros auxilios":"First aid","Buscando el número de emergencia de la obra…":"Looking up the site emergency number…","Sin señal: llama al número que está en el cartel.":"No signal: call the number on the poster.","Llama al número que está en el cartel, o avisa al brigadista.":"Call the number on the poster, or tell the responder.","Llamar a la emergencia de la obra":"Call the site emergency number","En esta obra":"On this site","🔊 Escuchar":"🔊 Listen","No hagas":"Don't","‹ Otro caso":"‹ Another case","Este celular no lee en voz alta":"This phone can't read aloud","⏹ Parar":"⏹ Stop","Guía básica de primeros auxilios. No reemplaza la capacitación ni la atención médica.":"Basic first-aid guide. It does not replace training or medical care.","Caída o golpe fuerte":"Fall or hard knock","Mira que no haya peligro para ti: carga, borde o tránsito.":"Make sure there's no danger to you: loads, edges or traffic.","Llama a la emergencia de la obra y al brigadista.":"Call the site emergency number and the responder.","No lo muevas si cayó de altura o se golpeó la cabeza, el cuello o la espalda. Solo si hay fuego o derrumbe.":"Don't move them if they fell from height or hit their head, neck or back. Only if there's fire or a collapse.","Háblale. Que no se levante. Pregúntale qué le duele.":"Talk to them. Don't let them get up. Ask where it hurts.","Si sangra, presiona la herida con una tela limpia.":"If they're bleeding, press on the wound with a clean cloth.","Abrígalo y quédate a su lado hasta que llegue la ayuda.":"Keep them warm and stay with them until help arrives.","No lo sientes ni le des de beber.":"Don't sit them up or give them anything to drink.","No le quites el casco si se golpeó la cabeza, salvo que no pueda respirar.":"Don't take off their helmet if they hit their head, unless they can't breathe.","Corte o sangrado":"Cut or bleeding","Ponte guantes: están en el botiquín.":"Put on gloves: they're in the first aid kit.","Presiona fuerte la herida con gasa o tela limpia, sin soltar.":"Press firmly on the wound with gauze or a clean cloth, without letting go.","Si se empapa, pon otra encima. No quites la primera.":"If it soaks through, put another on top. Don't remove the first one.","Si es en un brazo o una pierna y no está roto, levántalo.":"If it's on an arm or leg and it isn't broken, raise it.","Si sangra mucho o no para: emergencia de la obra.":"If it bleeds a lot or won't stop: site emergency.","No saques lo que esté clavado: presiona alrededor.":"Don't pull out anything stuck in the wound: press around it.","No pongas tierra, café ni pasta dental.":"Don't put soil, coffee or toothpaste on it.","Quemadura":"Burn","Aléjalo de lo que lo quemó.":"Move them away from what burned them.","Echa agua fría del caño sobre la quemadura por 20 minutos.":"Run cool tap water over the burn for 20 minutes.","Quítale anillos, reloj o ropa que no esté pegada, antes de que se hinche.":"Take off rings, watch or clothing that isn't stuck, before it swells.","Cúbrela con gasa limpia o plástico de cocina, sin apretar.":"Cover it loosely with clean gauze or cling film.","Si es grande, en la cara, las manos o con ampollas: emergencia de la obra.":"If it's large, on the face or hands, or blistered: site emergency.","Si es por un químico: lávalo con mucha agua por 20 minutos y mira su hoja MSDS.":"If it's from a chemical: rinse with plenty of water for 20 minutes and check its safety data sheet.","No pongas hielo, pasta dental, aceite ni mantequilla.":"Don't put ice, toothpaste, oil or butter on it.","No revientes las ampollas.":"Don't pop the blisters.","Descarga eléctrica":"Electric shock","No lo toques mientras siga en contacto con la corriente.":"Don't touch them while they're still in contact with the current.","Corta la energía en el tablero. Si no puedes, sepáralo con algo seco de madera o plástico.":"Switch off the power at the panel. If you can't, push them away with something dry made of wood or plastic.","Llama a la emergencia de la obra: toda descarga la ve un médico, aunque se vea bien.":"Call the site emergency number: every shock must be seen by a doctor, even if they look fine.","Si no responde y no respira normal: empieza la RCP si sabes, y pide el desfibrilador (DEA) si hay.":"If they don't respond and aren't breathing normally: start CPR if you know how, and ask for the defibrillator (AED) if there is one.","Enfría las quemaduras con agua y cúbrelas.":"Cool the burns with water and cover them.","No uses nada de metal ni mojado para separarlo.":"Don't use anything metal or wet to push them away.","No lo dejes solo.":"Don't leave them alone.","Desmayo":"Fainting","Acuéstalo boca arriba.":"Lay them on their back.","Levántale las piernas un poco, si no se golpeó.":"Raise their legs a little, if they weren't hurt in the fall.","Aflójale la ropa del cuello y el cinturón.":"Loosen the clothing at their neck and their belt.","Si respira pero no despierta: ponlo de costado y llama a la emergencia.":"If they're breathing but don't wake up: put them on their side and call the emergency number.","Si no respira normal: emergencia de la obra y RCP si sabes.":"If they aren't breathing normally: site emergency, and CPR if you know how.","No le des comida ni bebida hasta que esté bien despierto.":"Don't give them food or drink until they're fully awake.","No le eches agua en la cara.":"Don't throw water on their face.","Golpe de calor":"Heatstroke","Llévalo a la sombra o a un lugar fresco.":"Move them into the shade or somewhere cool.","Quítale el EPP y la ropa de más.":"Take off their PPE and any extra clothing.","Enfríalo: agua fresca en la piel, abanícalo, paños húmedos en el cuello y las axilas.":"Cool them down: cool water on the skin, fan them, damp cloths on the neck and armpits.","Si está despierto y puede tragar: agua a sorbos.":"If they're awake and can swallow: small sips of water.","Si está confundido, vomita o se desmaya: emergencia de la obra.":"If they're confused, vomiting or fainting: site emergency.","No le des alcohol ni bebidas energizantes.":"Don't give them alcohol or energy drinks.","Caso de esta obra":"This site's own case","Adaptado por la obra":"Adapted by the site","Botiquín":"First aid kit","Camilla":"Stretcher","Centro de salud más cercano":"Nearest health center","Nota de la obra":"Site note"},"pt":{"Primeros auxilios":"Primeiros socorros","Buscando el número de emergencia de la obra…":"Buscando o número de emergência da obra…","Sin señal: llama al número que está en el cartel.":"Sem sinal: ligue para o número que está no cartaz.","Llama al número que está en el cartel, o avisa al brigadista.":"Ligue para o número que está no cartaz ou avise o brigadista.","Llamar a la emergencia de la obra":"Ligar para a emergência da obra","En esta obra":"Nesta obra","🔊 Escuchar":"🔊 Ouvir","No hagas":"Não faça","‹ Otro caso":"‹ Outro caso","Este celular no lee en voz alta":"Este celular não lê em voz alta","⏹ Parar":"⏹ Parar","Guía básica de primeros auxilios. No reemplaza la capacitación ni la atención médica.":"Guia básico de primeiros socorros. Não substitui o treinamento nem o atendimento médico.","Caída o golpe fuerte":"Queda ou pancada forte","Mira que no haya peligro para ti: carga, borde o tránsito.":"Veja se não há perigo para você: carga, borda ou trânsito.","Llama a la emergencia de la obra y al brigadista.":"Ligue para a emergência da obra e para o brigadista.","No lo muevas si cayó de altura o se golpeó la cabeza, el cuello o la espalda. Solo si hay fuego o derrumbe.":"Não o mova se caiu de altura ou bateu a cabeça, o pescoço ou as costas. Só se houver fogo ou desabamento.","Háblale. Que no se levante. Pregúntale qué le duele.":"Fale com ele. Não deixe que se levante. Pergunte o que dói.","Si sangra, presiona la herida con una tela limpia.":"Se sangrar, pressione o ferimento com um pano limpo.","Abrígalo y quédate a su lado hasta que llegue la ayuda.":"Agasalhe-o e fique ao lado dele até a ajuda chegar.","No lo sientes ni le des de beber.":"Não o sente nem lhe dê de beber.","No le quites el casco si se golpeó la cabeza, salvo que no pueda respirar.":"Não tire o capacete se ele bateu a cabeça, a menos que não consiga respirar.","Corte o sangrado":"Corte ou sangramento","Ponte guantes: están en el botiquín.":"Calce luvas: estão no kit de primeiros socorros.","Presiona fuerte la herida con gasa o tela limpia, sin soltar.":"Pressione com força o ferimento com gaze ou pano limpo, sem soltar.","Si se empapa, pon otra encima. No quites la primera.":"Se encharcar, coloque outra por cima. Não tire a primeira.","Si es en un brazo o una pierna y no está roto, levántalo.":"Se for num braço ou numa perna e não estiver quebrado, levante-o.","Si sangra mucho o no para: emergencia de la obra.":"Se sangrar muito ou não parar: emergência da obra.","No saques lo que esté clavado: presiona alrededor.":"Não tire o que estiver cravado: pressione ao redor.","No pongas tierra, café ni pasta dental.":"Não coloque terra, café nem pasta de dente.","Quemadura":"Queimadura","Aléjalo de lo que lo quemó.":"Afaste-o do que o queimou.","Echa agua fría del caño sobre la quemadura por 20 minutos.":"Jogue água fria da torneira sobre a queimadura por 20 minutos.","Quítale anillos, reloj o ropa que no esté pegada, antes de que se hinche.":"Tire anéis, relógio ou roupa que não esteja grudada, antes que inche.","Cúbrela con gasa limpia o plástico de cocina, sin apretar.":"Cubra com gaze limpa ou filme plástico, sem apertar.","Si es grande, en la cara, las manos o con ampollas: emergencia de la obra.":"Se for grande, no rosto, nas mãos ou com bolhas: emergência da obra.","Si es por un químico: lávalo con mucha agua por 20 minutos y mira su hoja MSDS.":"Se for por um produto químico: lave com muita água por 20 minutos e veja a ficha FDS dele.","No pongas hielo, pasta dental, aceite ni mantequilla.":"Não coloque gelo, pasta de dente, óleo nem manteiga.","No revientes las ampollas.":"Não es
