.doc .ic{font-size:22px;line-height:1;flex:0 0 auto}
.doc .tx{flex:1;min-width:0;display:grid;gap:2px}
.doc b{font-weight:700;overflow-wrap:anywhere}
.doc small{color:#8FB0C2;font-size:12.5px}
.doc .nuevo{color:#F5B700;font-weight:700}
.doc .ir{flex:0 0 auto;color:#F5B700;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}

.doc .ya{color:#6FD08C;font-weight:700}
div.doc.off{opacity:.55}
div.doc.off .ir{color:#8FB0C2;font-weight:600}

.baja .riel i{display:block;height:100%;width:0;background:#F5B700;border-radius:6px;transition:width .25s}
.baja p{margin:9px 0 0;font-size:13.5px;font-variant-numeric:tabular-nums}
.nota{margin:14px 0 0;font-size:13px;color:#8FB0C2}

.vtit{flex:1;min-width:0;font-size:15px;line-height:1.3;overflow-wrap:anywhere}

.vatras{background:transparent;color:#EAF2F7;border:1px solid rgba(255,255,255,.25)}
.vbaja{background:#F5B700;color:#0B2A3A;border:0}
.vatras:focus-visible,.vbaja:focus-visible{outline:2px solid #EAF2F7;outline-offset:2px}

.vmsg{text-align:center;color:#A9C2D0;font-size:14px;margin:6px 0}
.vpag{position:relative;background:#fff;border-radius:4px;box-shadow:0 2px 10px rgba(0,0,0,.35);overflow:hidden;min-height:120px}
.vpag canvas{display:block;width:100%;height:auto}
.vpag .vn{position:absolute;right:8px;bottom:6px;font-size:11.5px;color:#4A5A66;background:rgba(255,255,255,.85);border-radius:6px;padding:1px 6px}

    var items=[];
    if(web(j.url)) items.push({ nombre:nombre, url:j.url, enlace:true });
    (Array.isArray(j.docs) ? j.docs : []).forEach(function(d){ if(d && web(d.url)) items.push({ nombre:d.nombre||nombre, url:d.url, fecha:d.fecha }); });
    return items;
  }
  /* cuáles de estos ya están en este celular: { ruta: true } */
  function guardados(items){
    var out={};
    if(!PUEDE) return Promise.resolve(out);
    return caja().then(function(c){
      return Promise.all(items.map(function(it){
        if(!nuestra(it.url)) return null;
        var k=rutaDoc(it.url);
        return c.match(k).then(function(r){ if(r) out[k]=true; });
      }));
    }).then(function(){ return out; }, function(){ return out; });
  }
  var LISTA=null;     /* lo que está pintado: para rehacerlo al volver con «atrás» */
  function pintarLista(nombre, items, sinRed, cuando){
    LISTA={ nombre:nombre, items:items, sinRed:sinRed, cuando:cuando };
    return guardados(items).then(function(ya){
      var primero=true;
      var filas=items.map(function(it, i){
        var marca='', k=nuestra(it.url) ? rutaDoc(it.url) : '', esta=!!(k && ya[k]);
        if(!it.enlace && primero){ marca=' · <span class="nuevo">'+esc(t('el más reciente'))+'</span>'; primero=false; }
        var sub = it.enlace ? esc(t('Enlace')) : esc(t('Subido el {0}', fecha(it.fecha)));
        if(sinRed){
          if(!esta) return '<div class="doc off"><span class="ic" aria-hidden="true">'+(it.enlace?'🔗':'📄')+'</span>'+
            '<span class="tx"><b>'+esc(it.nombre)+'</b><small>'+sub+'</small></span><span class="ir">'+esc(t('Necesita señal'))+'</span></div>';
          return '<a class="doc" data-i="'+i+'" href="'+esc(k+colaDe())+'"><span class="ic" aria-hidden="true">📄</span>'+
            '<span class="tx"><b>'+esc(it.nombre)+'</b><small>'+sub+' · <span class="ya">'+esc(t('Guardado'))+'</span></small></span>'+
            '<span class="ir">'+esc(t('Abrir'))+'</span></a>';
        }
        return '<a class="doc" data-i="'+i+'" href="'+esc(it.url)+'" rel="noopener"><span class="ic" aria-hidden="true">'+(it.enlace?'🔗':'📄')+'</span>'+
          '<span class="tx"><b>'+esc(it.nombre)+'</b><small>'+sub+marca+(esta ? ' · <span class="ya">✓ '+esc(t('guardado en este celular'))+'</span>' : '')+'</small></span>'+
          '<span class="ir">'+esc(t('Abrir'))+'</span></a>';
      }).join('');
      cuerpo.innerHTML = sinRed
        ? '<h1>'+esc(t('Sin señal'))+'</h1><p><b style="color:#EAF2F7">'+esc(nombre)+'</b></p>'+
          '<div class="tarj" style="padding:16px 18px">'+esc(t('Lo que este celular tiene guardado, al {0}. Puede haber versiones más nuevas: cuando tengas señal, escanea el cartel otra vez.', fechaDeMs(cuando)))+'</div>'+
          '<div class="lista">'+filas+'</div>'
        : '<h1>'+esc(nombre)+'</h1><p>'+esc(t('Toca el que necesitas.'))+'</p><div class="lista">'+filas+'</div>';
      [].forEach.call(cuerpo.querySelectorAll('a.doc'), function(a){
        a.addEventListener('click', function(ev){
          var it=items[+a.getAttribute('data-i')];
          if(!it || !nuestra(it.url)) return;                          /* un enlace: como siempre */
          if(!esPdf(it) && (!PUEDE || FALTA)) return;
          if(esPdf(it) && sinRed && !PUEDE) return;
          if(ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.button) return;
          ev.preventDefault();
          if(a.getAttribute('data-va')) return;
          a.setAttribute('data-va', '1');
          var ir=a.querySelector('.ir');
          abrirDoc(it, { reemplazar:false, lista:true, alAvance:function(n, total){ if(ir) ir.textContent = total>0 ? Math.min(99, Math.floor(n*100/total))+' %' : (n/1048576).toFixed(1)+' MB'; } })
            .then(function(){ if(!document.body.classList.contains('ver')) setTimeout(function(){ if(LISTA && !document.body.classList.contains('ver')) pintarLista(LISTA.nombre, LISTA.items, LISTA.sinRed, LISTA.cuando); }, 2500); });
        });
      });
    });
  }
  /* al volver con «atrás» desde el documento, la lista se rehace (con lo
     que ahora sí está guardado) */
  try{
    window.addEventListener('pageshow', function(ev){
      if(ev && ev.persisted && LISTA) pintarLista(LISTA.nombre, LISTA.items, LISTA.sinRed, LISTA.cuando);
    });
  }catch(_ps){}

  function sinInternet(){
    if(FALTA){
      di(t('Sin señal'), esc(t('Ese documento ya no está guardado en este celular.'))+'<br><br>'+esc(t('Vuelve a escanear el cartel cuando tengas datos o wifi.')));
      return;
    }
    di(t('Sin internet'), esc(t('Necesitas señal para abrir este documento la primera vez. Después queda guardado en este celular y abre también sin señal.'))+
      '<br><br>'+esc(t('Vuelve a escanear el cartel cuando tengas datos o wifi.')));
  }
  /* sin señal: lo que este celular guardó de este cartel, si guardó algo.
     Con «soloSiHay» (la señal está lenta, no caída): si no hay copia no
     toca la pantalla y devuelve false, para seguir esperando al servidor. */
  function sinSenal(soloSiHay, vale){
    soloSiHay=(soloSiHay===true);
    function nada(){ if(!soloSiHay) sinInternet(); return false; }
    return conTope(leerResp(), 5000).then(function(g){
      if(!g) return nada();
      var j=g.j, nombre=j.titulo || nombreDe(j.hoja) || t('Documento de la obra');
      var items=armar(j, nombre);
      return guardados(items).then(function(ya){
        var hay=items.filter(function(it){ return nuestra(it.url) && ya[rutaDoc(it.url)]; });
        if(!hay.length) return nada();
        if(vale && !vale()) return false;        /* el servidor contestó mientras se miraba la caja */
        if(j.obra) pie.textContent=j.obra;
        if(items.length===1){
          var k=rutaDoc(hay[0].url);
          di(t('Sin señal'), '<b>'+esc(hay[0].nombre)+'</b><br><br>'+
             esc(t('Este celular guardó este documento el {0}. Puede haber una versión más nueva: cuando tengas señal, escanea el cartel otra vez.', fechaDeMs(g.t))),
             '<a class="btn" id="copia" href="'+esc(k+colaDe())+'">'+esc(t('Abrir la copia guardada'))+'</a>');
          var b=document.getElementById('copia');
          if(b) b.addEventListener('click', function(ev){
            if(ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.button) return;
            ev.preventDefault();
            if(esPdf(hay[0])){ verAqui(hay[0], {}, function(){ location.href=k+colaDe(); }); return; }
            caja().then(function(c){ return tocar(c, k).then(function(){ return mostrar(c, k, false); }); }).then(function(){}, function(){ location.href=k+colaDe(); });
          });
          return true;
        }
        return pintarLista(nombre, items, true, g.t).then(function(){ return true; });
      });
    }).then(function(r){ return r; }, nada);
  }
  /* la respuesta del servidor. Si tarda más de 7 s (señal de sótano: ni
     llega ni falla) y este celular ya tiene una copia, se ofrece la copia;
     si no la tiene, se sigue esperando, como siempre. */
  function conServidor(p, alOk){
    var hecho=false;
    var lento=setTimeout(function(){
      if(hecho) return;
      sinSenal(true, function(){ if(hecho) return false; hecho=true; return true; });
    }, 7000);
    p.then(function(j){ if(hecho) return; hecho=true; clearTimeout(lento); alOk(j); },
           function(){ if(hecho) return; hecho=true; clearTimeout(lento); sinSenal(); });
  }

  if(tk){
    conServidor(rpc('sst_qr_abrir', {p_t:tk}), function(j){
      j = j || {};
      var nombre = j.titulo || nombreDe(j.hoja) || t('Documento de la obra');
      if(j.obra) pie.textContent = j.obra;
      if(j.ok){
        /* lo que abre: el enlace puesto a mano y lo que haya en la carpeta */
        var items=armar(j, nombre);
        var anotado=null;
        if(items.length){
          anotado=guardarResp(j).then(function(){
            return limpiar(items.filter(function(it){ return nuestra(it.url); }).map(function(it){ return rutaDoc(it.url); }));
          });
        }
        if(items.length===1){ document.getElementById('quien').textContent = items[0].nombre; abrirDoc(items[0], { reemplazar:true, alAvance:avance, antes:anotado }); return; }
        if(items.length>1){ pintarLista(nombre, items, false, 0); return; }
      }
      var e=j.error||'';
      if(e==='no_existe'){
        olvidar();
        di(t('Este cartel ya no está activo'), esc(t('Pídele a tu supervisor que imprima el cartel nuevo desde OBRASST, en «Los QR de tu obra».')));
      } else if(e==='sin_documento'){
        olvidar();
        di(t('Todavía no está cargado'),
           t('Esta obra aún no subió su <b>{0}</b> a OBRASST.', esc(nombre))+'<br><br>'+
           esc(t('Pídeselo a tu supervisor SSOMA: se sube una vez, en la app o en la web, y este mismo cartel empieza a funcionar.')));
      } else {
        di(t('No se pudo abrir'), esc(t('Vuelve a escanear el cartel en un momento. Si sigue igual, avísale a tu supervisor.')));
      }
    });
    return;
  }

  if(!cod || !hoja){
    di(t('Este cartel está incompleto'),
       esc(t('Al código QR le falta el documento. Pídele a tu supervisor que vuelva a imprimir el cartel desde OBRASST.')));
    return;
  }
  conServidor(rpc('sst_hoja_por_codigo', {p_cod:cod, p_hoja:hoja}), function(j){
    if(j && j.ok && web(j.url)){
      if(j.obra) pie.textContent = j.obra;
      var uno={ nombre:nombreDe(hoja) || t('Documento de la obra'), url:j.url };
      var anotado=null;
      if(nuestra(j.url)){
        anotado=guardarResp({ obra:j.obra, hoja:hoja, docs:[{ nombre:uno.nombre, url:j.url, fecha:'' }] }).then(function(){ return limpiar([rutaDoc(j.url)]); });
      }
      abrirDoc(uno, { reemplazar:true, alAvance:avance, antes:anotado });
      return;
    }
    var e=(j&&j.error)||'';
    if(e==='obra_no_existe'){
      olvidar();
      di(t('No encuentro esa obra'), esc(t('Este cartel no corresponde a ninguna obra en OBRASST. Puede que sea de una obra que ya cerró.')));
    } else if(e==='sin_documento'){
      olvidar();
      if(j.obra) pie.textContent = j.obra;
      di(t('Todavía no está cargado'),
         t('Esta obra aún no subió su <b>{0}</b> a OBRASST.', esc(nombreDe(hoja) || t('Documento de la obra')))+'<br><br>'+
         esc(t('Pídeselo a tu supervisor SSOMA: se carga una vez y este mismo cartel empieza a funcionar.')));
    } else {
      di(t('No se pudo abrir'), esc(t('Vuelve a escanear el cartel en un momento. Si sigue igual, avísale a tu supervisor.')));
    }
  });
})();
</script>
</body></html>
