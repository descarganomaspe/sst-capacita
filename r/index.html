label{display:block;font-size:13.5px;color:var(--gris);margin:12px 0 4px}
input,textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid #C4CFD7;border-radius:10px;background:#fff;color:var(--texto)}
input:focus,textarea:focus{outline:2px solid var(--tinta);outline-offset:1px}
.lienzo{border:2px dashed #B8C5CE;border-radius:12px;overflow:hidden;background:#fff;margin:6px 0 4px}
.lienzo canvas{display:block;touch-action:none;cursor:crosshair}
.bt{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-weight:700;padding:12px 16px;border-radius:12px;border:1px solid var(--tinta);

.bt.sec{background:#fff;color:var(--tinta);border-color:#B8C5CE} .bt.oro{background:var(--oro);border-color:var(--oro);color:var(--tinta)}

.fila-bt{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0} .fila-bt .bt{flex:1 1 140px}
.lnk{background:none;border:0;padding:4px 0;color:var(--tinta);font:inherit;font-size:13.5px;font-weight:700;text-decoration:underline;cursor:pointer}
.msg{font-size:14px;min-height:20px;margin:10px 0 0} .msg.mal{color:var(--mal)} .msg.gris{color:var(--gris)}
.nota{font-size:12.5px;color:var(--gris2);text-align:center;margin:18px 16px 0}
.centro{text-align:center;padding:40px 16px}
.giro{width:34px;height:34px;margin:22px auto 0;border-radius:50%;border:3px solid rgba(11,42,58,.15);border-top-color:var(--oro);animation:g .8s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.giro{animation-duration:2.4s}}
@media print{.no-imp{display:none!important} body{background:#fff} .tarj{break-inside:avoid}}

    Fs.forEach(function(k){ if(k.ok && k.f) pintarFirma($('f-'+k.k), k.f); });
    $('b-pdf').onclick=function(){ doc('pdf'); }; $('b-xlsx').onclick=function(){ doc('xlsx'); };
    if($('resolver')) pintarResolver();
    if($('mi-firma')) pintarMiFirma(miPaso);
    pie.textContent='OBRASST deja constancia de quién dijo ser, a qué hora firmó y desde dónde. Este enlace es solo de este requerimiento.';
  }
  function doc(tipo){
    var m=$('msg'), b=$(tipo==='pdf' ? 'b-pdf' : 'b-xlsx'); b.disabled=true; m.className='msg gris'; m.textContent='Armando el archivo…';
    papel().then(function(){
      if(tipo==='pdf') bajar(RQB.pdf(R, {}).output('blob'), RQB.nombreArchivo(R, 'pdf'));
      else bajar(RQB.xlsx(R, { firmaPNG:firmaPNG }), RQB.nombreArchivo(R, 'xlsx'));
      b.disabled=false; m.textContent='';
    }).catch(function(){ b.disabled=false; m.className='msg mal'; m.textContent='No se pudo armar el archivo. Revisa tu conexión e inténtalo otra vez.'; });
  }
  /* el gerente firma en su casillero: su nombre, su trazo y, si quiere, una nota */
  function pintarMiFirma(p){
    var c=$('mi-firma'), r=R, aut=(r.res && r.res.accion==='autorizar') ? r.res : null;
    c.innerHTML='<h2>Tu firma · '+esc(p.t)+'</h2>'+
      '<p class="resumen"><b>'+esc((r.por||{}).n||'')+'</b> pide lo de arriba'+(aut ? ', y <b>'+esc(aut.n||'')+'</b> ya lo aprobó por Seguridad' : '')+'. Falta tu firma como <b>'+esc(p.t)+'</b>.</p>'+
      '<p style="margin:0 0 4px;font-size:13.5px;color:var(--gris)">Queda tu nombre, la hora y tu firma, y dice «por enlace». Si no estás de acuerdo, no firmes y avísale a quien te lo envió.</p>'+
      '<label for="m-n">Tu nombre y apellidos</label><input id="m-n" maxlength="120" autocomplete="name" value="'+esc(p.n||'')+'">'+
      '<label for="m-nota">Nota <span style="color:var(--gris2)">(si quieres)</span></label><input id="m-nota" maxlength="300">'+
      '<label for="m-cv">Tu firma: con el dedo o con el mouse, dentro del recuadro</label><div class="lienzo"><canvas id="m-cv"></canvas></div>'+
      '<button type="button" class="lnk" id="m-borrar">Borrar y repetir la firma</button>'+
      '<p class="msg" id="m-msg"></p><div class="fila-bt"><button type="button" class="bt oro" id="m-ok">✍️ Firmar</button></div>';
    PADM=pad($('m-cv'), 170);
    var limpia=function(){ var m=$('m-msg'); if(m && /\bmal\b/.test(m.className)) m.textContent=''; };
    PADM.alFirmar=limpia; c.oninput=limpia;
    $('m-borrar').onclick=function(){ PADM.limpiar(); };
    $('m-ok').onclick=firmarMia;
  }
  function firmarMia(){
    var m=$('m-msg'); m.className='msg mal';
    var n=$('m-n').value.trim();
    if(n.length<3){ m.textContent='Escribe tu nombre y apellidos.'; $('m-n').focus(); return; }
    var tr=PADM ? PADM.trazo() : null;
    if(!tr){ m.textContent='Falta tu firma: firma dentro del recuadro.'; return; }
    $('m-ok').disabled=true; m.className='msg gris'; m.textContent='Guardando…';
    rpc('sst_req_visar_enlace', { p:{ t:tk, x:fk, n:n, f:tr, nota:$('m-nota').value.trim() } }).then(function(j){
      if(j && j.ok){ R=j.req; if(j.mi) MI=j.mi; pintar(); window.scrollTo(0,0);
        var d=document.createElement('div'); d.className='aviso ok'; d.id='hecho';
        d.innerHTML='<b>Firmado.</b> Gracias: quien lo pidió ya lo ve en OBRASST.';
        var v=$('mi-lista'); if(v) v.remove();
        cuerpo.insertBefore(d, cuerpo.firstChild); return; }
      if($('m-ok')) $('m-ok').disabled=false;
      m.className='msg mal';
      var mt=(j && j.motivo)||'';
      m.textContent={ ya_firmado:'Ese casillero ya está firmado. Vuelve a abrir el enlace para verlo.', no_esta_autorizado:'Todavía falta la aprobación de Seguridad.', paso:'Este enlace ya no sirve para firmar: pide que te lo envíen otra vez.',
                      firma:'Falta tu nombre o tu firma.', muy_seguido:'Espera un momento y vuelve a intentarlo.', no_existe:'Este enlace ya no está activo.' }[mt] || 'No se pudo guardar. Inténtalo otra vez.';
      if(mt==='ya_firmado' || mt==='no_esta_autorizado' || mt==='paso') abrir();
    }, function(){ if($('m-ok')) $('m-ok').disabled=false; m.className='msg mal'; m.textContent='No hubo conexión. Inténtalo otra vez.'; });
  }
  function pintarResolver(){
    var c=$('resolver'), r=R;
    c.innerHTML='<h2>¿Lo autorizas?</h2><p style="margin:0 0 6px;font-size:14.5px"><b>'+esc((r.por||{}).n||'')+'</b> te envió este pedido para que lo autorices desde aquí, sin cuenta. Queda tu nombre, la hora y tu firma, y dice «por enlace».</p>'+
      '<p style="margin:0 0 4px;font-size:13.5px;color:var(--gris)">Si alguna cantidad no va, cámbiala antes de firmar.</p>'+
      r.items.map(function(it, i){ return '<div class="lin"><div class="lin-tx"><b>'+esc(it.d)+'</b><small>Pide '+RQB.num(it.c)+' '+esc(it.u||'und')+'</small></div>'+
        '<div class="lin-n"><input type="text" inputmode="decimal" maxlength="9" id="c'+i+'" aria-label="Cantidad autorizada de '+esc(it.d)+'" value="'+esc(RQB.num(it.c))+'"></div></div>'; }).join('')+
      '<label for="r-n">Tu nombre y apellidos</label><input id="r-n" maxlength="120" autocomplete="name" value="'+esc((r.a||{}).n||'')+'">'+
      '<label for="r-c">Tu cargo</label><input id="r-c" maxlength="80" value="'+esc((r.a||{}).c||'')+'">'+
      '<label for="r-nota">Nota <span style="color:var(--gris2)">(si quieres; para observar o rechazar, el motivo)</span></label><textarea id="r-nota" rows="2" maxlength="1000"></textarea>'+
      '<label for="r-cv">Tu firma: con el dedo o con el mouse, dentro del recuadro</label><div class="lienzo"><canvas id="r-cv"></canvas></div>'+
      '<button type="button" class="lnk" id="r-borrar">Borrar y repetir la firma</button>'+
      '<p class="msg" id="r-msg"></p><div class="fila-bt"><button type="button" class="bt oro" id="r-ok">✅ Autorizar</button>'+
      '<button type="button" class="bt sec" id="r-obs">↩ Observar</button><button type="button" class="bt sec" id="r-no">Rechazar</button></div>';
    PAD=pad($('r-cv'), 170);
    /* el aviso de lo que faltaba se va apenas lo corrige */
    var limpia=function(){ var m=$('r-msg'); if(m && /\bmal\b/.test(m.className)) m.textContent=''; };
    PAD.alFirmar=limpia; c.oninput=limpia;
    $('r-borrar').onclick=function(){ PAD.limpiar(); };
    $('r-ok').onclick=function(){ resolver('autorizar'); }; $('r-obs').onclick=function(){ resolver('observar'); }; $('r-no').onclick=function(){ resolver('rechazar'); };
  }
  function resolver(accion){
    var m=$('r-msg'), r=R; m.className='msg mal';
    var n=$('r-n').value.trim(), nota=$('r-nota').value.trim();
    if(n.length<3){ m.textContent='Escribe tu nombre y apellidos.'; $('r-n').focus(); return; }
    var p={ t:tk, accion:accion, n:n, c:$('r-c').value.trim(), nota:nota };
    if(accion==='autorizar'){
      var cant=[], distinto=false;
      for(var i=0;i<r.items.length;i++){
        var v=parseFloat(String($('c'+i).value).replace(',', '.'));
        if(isNaN(v) || v<0 || v>1000000){ m.textContent='Revisa la cantidad de la línea '+(i+1)+'.'; $('c'+i).focus(); return; }
        v=Math.round(v*100)/100; cant.push(v); if(v!==+r.items[i].c) distinto=true;
      }
      if(!cant.some(function(v){ return v>0; })){ m.textContent='Si no autorizas ninguna línea, recházalo con su motivo.'; return; }
      var tr=PAD ? PAD.trazo() : null;
      if(!tr){ m.textContent='Falta tu firma: firma dentro del recuadro.'; return; }
      p.f=tr; if(distinto) p.cant=cant;
    } else {
      if(nota.length<3){ m.textContent=(accion==='observar' ? 'Escribe en la nota qué hay que corregir.' : 'Escribe en la nota por qué se rechaza.'); $('r-nota').focus(); return; }
      var tr2=PAD ? PAD.trazo() : null; if(tr2) p.f=tr2;
    }
    ['r-ok','r-obs','r-no'].forEach(function(id){ $(id).disabled=true; });
    m.className='msg gris'; m.textContent='Guardando…';
    rpc('sst_req_resolver_enlace', { p:p }).then(function(j){
      if(j && j.ok){ R=j.req; pintar(); window.scrollTo(0,0);
        var d=document.createElement('div'); d.className='aviso ok'; d.id='hecho';
        d.innerHTML='<b>'+(accion==='autorizar' ? 'Autorizado.' : (accion==='observar' ? 'Devuelto con tu observación.' : 'Rechazado.'))+'</b> Quien lo pidió ya lo ve en su app.';
        cuerpo.insertBefore(d, cuerpo.firstChild); return; }
      ['r-ok','r-obs','r-no'].forEach(function(id){ if($(id)) $(id).disabled=false; });
      m.className='msg mal';
      var mt=(j && j.motivo)||'';
      m.textContent={ ya_resuelto:'Ya lo resolvió otra persona hace un momento. Vuelve a abrir el enlace para verlo.', solo_con_cuenta:'Este pedido solo se autoriza entrando a OBRASST con una cuenta.',
                      firma:'Falta tu nombre o tu firma.', nota:'Escribe el motivo en la nota.', muy_seguido:'Espera un momento y vuelve a intentarlo.', no_existe:'Este enlace ya no está activo.' }[mt] || 'No se pudo guardar. Inténtalo otra vez.';
      if(mt==='ya_resuelto') abrir();
    }, function(){ ['r-ok','r-obs','r-no'].forEach(function(id){ if($(id)) $(id).disabled=false; }); m.className='msg mal'; m.textContent='No hubo conexión. Inténtalo otra vez.'; });
  }
  function abrir(){
    /* con la llave de una firma, el servidor dice cuál es «la mía». Un servidor que todavía no la conoce: se abre sin ella */
    var pedir=fk ? rpc('sst_req_abrir', { p_t:tk, p_f:fk }).then(null, function(cod){ return cod===404 ? rpc('sst_req_abrir', { p_t:tk }) : Promise.reject(cod); }) : rpc('sst_req_abrir', { p_t:tk });
    pedir.then(function(j){
      if(!j || !j.ok || !j.req){
        var mt=(j && j.motivo)||'';
        if(mt==='muy_seguido') di('Espera un momento', 'Este enlace se abrió muchas veces seguidas. Vuelve a intentarlo en unos minutos.');
        else di('Este enlace ya no está activo', 'Pídele a quien te lo mandó que te lo envíe otra vez desde OBRASST.');
        return;
      }
      R=j.req; MI=j.mi||null; pintar();
      if(fk && !MI){ var d=document.createElement('div'); d.className='aviso med no-imp'; d.id='mi-no'; d.innerHTML='<b>Este enlace ya no sirve para firmar.</b> Puedes ver y bajar el pedido; para firmar, pide que te envíen tu enlace otra vez.'; cuerpo.insertBefore(d, cuerpo.firstChild); }
    }, function(cod){
      if(cod===404) di('Todavía no está disponible', 'Los requerimientos se están terminando de activar. Vuelve a abrir el enlace más tarde.');
      else di('Sin conexión', 'Necesitas internet para ver este requerimiento. Vuelve a abrir el enlace cuando tengas señal.');
    });
  }
  tk=q('t').toLowerCase().replace(/[^0-9a-f]/g,'');
  fk=q('f').toLowerCase().replace(/[^0-9a-f]/g,''); if(fk.length!==16) fk='';
  if(tk.length!==32){ di('Este enlace está incompleto', 'Pídele a quien te lo mandó que te lo envíe otra vez desde OBRASST.'); return; }
  cargar('requerimiento.js?v='+RQ_VER).then(function(){ if(typeof RQB==='undefined') return Promise.reject('red'); abrir(); })
    .catch(function(){ di('No se pudo cargar', 'Revisa tu conexión y vuelve a abrir el enlace.'); });
})();
</script>
</body></html>
