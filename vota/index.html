    if(m==='codigo_raro') return S.paso='codigo', S.msg=t('Escribe el código completo: son doce letras y números.'), pintar();
    if(m==='cerrada' || m==='vencida') return aviso(t('La votación ya se cerró'), t('Ya no se puede votar con este código.'), '🔒');
    if(m==='anulada') return aviso(t('La votación se anuló'), t('Pregúntale a la junta electoral cómo sigue la elección.'), '⚠️');
    if(m==='bloqueado') return aviso(t('Tu código está bloqueado'), t('Se puso mal el documento cinco veces. Pídele a la junta electoral un código nuevo.'), '⛔');
    if(m==='ya_voto') return aviso(t('Ya votaste'), t('Tu voto ya está registrado. Cada código sirve una sola vez.'), '✅');
    if(m==='muy_seguido') return aviso(t('Sin señal'), t('Hubo muchos intentos en esta hora. Espera un rato y vuelve a abrir tu cédula.'), '⏳', reintento);
    if(m===404) return aviso(t('Sin señal'), t('La votación desde el celular todavía no está activa. Avísale a la junta electoral.'), '⚠️');
    return aviso(t('Sin señal'), t('Necesitas datos o wifi para votar. Inténtalo otra vez en un rato.'), '📶', reintento);
  }
  function cargar(){
    cuerpo.innerHTML='<h1>'+esc(t('Abriendo tu cédula…'))+'</h1><div class="giro"></div>';
    rpc('sst_votacion_cedula', { p_cod:S.cod }).then(function(j){
      if(!j || !j.ok) return porMotivo(j && j.motivo, cargar);
      S.C=j; pie.textContent=j.obra || '';
      if(j.ya) return porMotivo('ya_voto');
      if(j.estado!=='abierta') return porMotivo(j.estado);
      if(j.bloqueado) return porMotivo('bloqueado');
      S.paso='elegir'; S.sel=[]; S.blanco=false; S.msg=''; pintar();
    }, function(err){ porMotivo(err, cargar); });
  }
  function pintar(){
    var h='';
    if(S.paso==='codigo'){
      h='<h1>'+esc(t('Escribe tu código'))+'</h1><p class="sub">'+esc(t('Está en tu cédula personal, debajo del QR: doce letras y números.'))+'</p>'+
        '<div class="tarj"><input type="text" class="cod" id="v-cod" autocomplete="off" autocapitalize="characters" maxlength="20" placeholder="XXXX-XXXX-XXXX" value="'+esc(S.cod)+'"></div>'+
        '<p class="msg" id="v-msg">'+esc(S.msg)+'</p><button type="button" class="btn" id="v-abrir">'+esc(t('Abrir mi cédula'))+'</button>';
      cuerpo.innerHTML=h;
      document.getElementById('v-abrir').onclick=function(){
        var c=limpio(document.getElementById('v-cod').value);
        if(c.length<10){ document.getElementById('v-msg').textContent=t('Escribe el código completo: son doce letras y números.'); return; }
        S.cod=c; cargar();
      };
      return;
    }
    var C=S.C, m=Math.min(+C.marcas || 1, (C.cands || []).length || 1), nom={};
    (C.cands || []).forEach(function(c){ nom[c.id]=c.n; });
    if(S.paso==='elegir'){
      h=pasos(1)+cabecera()+'<h1>'+esc(m===1 ? t('Toca a tu candidato') : t('Toca hasta {0} candidatos', m))+'</h1><p class="sub">'+esc(t('Tu voto es secreto: se guarda sin tu nombre.'))+'</p>'+
        (C.cands || []).map(function(c){ var on=S.sel.indexOf(c.id)>-1; return '<button type="button" class="cand'+(on ? ' on' : '')+'" data-id="'+esc(c.id)+'" aria-pressed="'+on+'"><i>'+(on ? '✓' : '')+'</i><span>'+esc(c.n)+'</span></button>'; }).join('')+
        '<p class="msg" id="v-msg">'+esc(S.msg)+'</p>'+
        '<button type="button" class="btn" id="v-votar"'+(S.sel.length ? '' : ' disabled')+'>'+esc(t('Votar'))+'</button>'+
        '<button type="button" class="btn sec" id="v-blanco">'+esc(t('Votar en blanco'))+'</button>';
      cuerpo.innerHTML=h;
      Array.prototype.forEach.call(cuerpo.querySelectorAll('.cand'), function(b){ b.onclick=function(){
        var id=b.getAttribute('data-id'), i=S.sel.indexOf(id); S.msg='';
        if(i>-1) S.sel.splice(i, 1); else if(m===1) S.sel=[id]; else if(S.sel.length<m) S.sel.push(id); else S.msg=t('Ya marcaste {0}: toca uno para quitarlo.', m);
        pintar();
      }; });
      document.getElementById('v-votar').onclick=function(){ if(!S.sel.length) return; S.blanco=false; S.paso='confirmar'; S.msg=''; pintar(); window.scrollTo(0, 0); };
      document.getElementById('v-blanco').onclick=function(){ S.sel=[]; S.blanco=true; S.paso='confirmar'; S.msg=''; pintar(); window.scrollTo(0, 0); };
      return;
    }
    if(S.paso==='confirmar'){
      h=pasos(2)+cabecera()+'<h1>'+esc(t('¿Confirmas tu voto?'))+'</h1><p class="sub">'+esc(t('Después ya no se puede cambiar.'))+'</p>'+
        '<ul class="lista">'+(S.blanco ? '<li>'+esc(t('En blanco'))+'</li>' : S.sel.map(function(id){ return '<li>'+esc(nom[id] || '')+'</li>'; }).join(''))+'</ul>'+
        '<button type="button" class="btn" id="v-si">'+esc(t('Sí, es mi voto'))+'</button><button type="button" class="btn sec" id="v-cambiar">'+esc(t('Cambiar'))+'</button>';
      cuerpo.innerHTML=h;
      document.getElementById('v-si').onclick=function(){ S.paso='firmar'; S.msg=''; pintar(); window.scrollTo(0, 0); };
      document.getElementById('v-cambiar').onclick=function(){ S.paso='elegir'; S.blanco=false; pintar(); };
      return;
    }
    if(S.paso==='firmar'){
      h=pasos(3)+cabecera()+'<h1>'+esc(t('Para que tu voto cuente'))+'</h1><p class="sub">'+esc(t('Tu documento y tu firma van al padrón de los que votaron, no a tu voto.'))+'</p><div class="tarj">'+
        (C.pide_doc ? '<label for="v-doc">'+esc(t('Tu documento de identidad'))+'</label><input type="text" id="v-doc" inputmode="numeric" autocomplete="off" maxlength="20" value="'+esc(S.doc)+'">' : '')+
        '<label for="v-firma">'+esc(t('Tu firma'))+'</label><div class="pad"><canvas id="v-firma"></canvas></div><button type="button" class="borrar" id="v-borrar">'+esc(t('Borrar la firma'))+'</button></div>'+
        '<p class="msg" id="v-msg">'+esc(S.msg)+'</p><button type="button" class="btn" id="v-enviar">'+esc(t('Enviar mi voto'))+'</button><button type="button" class="btn sec" id="v-atras">'+esc(t('Cambiar'))+'</button>';
      cuerpo.innerHTML=h;
      S.pad=lienzo(document.getElementById('v-firma'));
      document.getElementById('v-borrar').onclick=function(){ S.pad.limpiar(); };
      document.getElementById('v-atras').onclick=function(){ if(S.enviando) return; S.paso='elegir'; S.blanco=false; S.msg=''; pintar(); };
      document.getElementById('v-enviar').onclick=enviar;
      return;
    }
  }
  function enviar(){
    if(S.enviando) return;
    var C=S.C, msg=document.getElementById('v-msg'), bt=document.getElementById('v-enviar'), doc='';
    if(C.pide_doc){ doc=document.getElementById('v-doc').value; S.doc=doc; if(limpio(doc).length<4){ msg.textContent=t('Escribe tu documento.'); return; } }
    var f=S.pad && S.pad.trazo(); if(!f){ msg.textContent=t('Falta tu firma.'); return; }
    S.enviando=true; bt.disabled=true; bt.textContent=t('Enviando…'); msg.textContent='';
    rpc('sst_votar', { p_cod:S.cod, p_doc:doc, p_marcas:S.blanco ? [] : S.sel.slice(), p_blanco:!!S.blanco, p_firma:JSON.stringify(f) }).then(function(j){
      S.enviando=false;
      if(j && j.ok) return listo(false);
      var m=j && j.motivo;
      if(m==='doc_no_coincide'){ bt.disabled=false; bt.textContent=t('Enviar mi voto'); msg.textContent=(j.quedan>0) ? t('Ese documento no es el del padrón. Te quedan {0} intentos.', j.quedan) : t('Ese documento no es el del padrón.'); if(!(j.quedan>0)) porMotivo('bloqueado'); return; }
      if(m==='ya_voto') return listo(true);
      if(m==='cedula_rara' || m==='firma_rara'){ bt.disabled=false; bt.textContent=t('Enviar mi voto'); msg.textContent=t('Algo no salió bien. Inténtalo otra vez.'); return; }
      porMotivo(m);
    }, function(err){
      S.enviando=false; bt.disabled=false; bt.textContent=t('Enviar mi voto');
      if(err===404) return porMotivo(404);
      msg.textContent=t('Tu voto no se envió: necesitas datos o wifi. Inténtalo otra vez.');
    });
  }
  function listo(yaEstaba){
    S.sel=[]; S.blanco=false; S.pad=null;
    try{ history.replaceState(null, '', location.pathname); }catch(_r){}
    cuerpo.innerHTML='<div class="ok">✅</div><h1>'+esc(t('Tu voto quedó registrado'))+'</h1>'+
      '<p class="sub">'+esc(yaEstaba ? t('Tu voto ya estaba registrado.') : t('Es secreto: ni la empresa ni la junta pueden saber por quién votaste.'))+'</p>'+
      '<p class="nota">'+esc(t('Ya puedes cerrar esta página.'))+'</p>';
  }
  /* el código: después del «#» (el QR y el enlace lo traen así); si no, se escribe */
  S.cod=limpio(decodeURIComponent(String(location.hash || '').replace(/^#/, '')));
  if(S.cod.length>=10) cargar(); else { S.cod=''; S.paso='codigo'; pintar(); }
  window.addEventListener('hashchange', function(){ var c=limpio(decodeURIComponent(String(location.hash || '').replace(/^#/, ''))); if(c.length>=10 && c!==S.cod){ S.cod=c; cargar(); } });
})();
</script>
</body></html>
