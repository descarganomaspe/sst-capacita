*{box-sizing:border-box}
:root{--fondo:#0B2A3A;--tinta:#EAF2F7;--suave:#A9C2D0;--tenue:#7D97A6;--oro:#F5B700;--viol:#A98BF0;--viol2:#6A3FB5;--bien:#6FD08C;--mal:#FF9A8B;

html,body{background:var(--fondo)}
body{margin:0;min-height:100vh;color:var(--tinta);padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px));

.caja{width:100%;max-width:470px;margin:0 auto}
.marca{font-size:12px;letter-spacing:.18em;color:var(--oro);font-weight:800;margin-bottom:18px;text-align:center}
h1{font-size:22px;margin:0 0 8px;line-height:1.3;text-wrap:balance;text-align:center}
h2{font-size:17px;margin:0 0 6px}
p{margin:0 0 8px;color:var(--suave);font-size:15px}
.cab p{text-align:center}
.giro{width:34px;height:34px;margin:26px auto 0;border-radius:50%;border:3px solid rgba(255,255,255,.18);border-top-color:var(--oro);animation:g .8s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.giro{animation-duration:2.4s}}
.sellos{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0 4px}
.sello{font-size:12.5px;padding:4px 10px;border-radius:999px;background:var(--caja);border:1px solid var(--raya);color:var(--tinta)}
.elige{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 6px}
.elige button{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:14px;border-radius:14px;cursor:pointer;
  background:var(--caja);border:1px solid var(--raya);color:var(--tinta);font:inherit}
.elige button b{font-size:15px}
.elige button small{font-size:12.5px;color:var(--suave);line-height:1.35}
.elige button .ic{font-size:22px;line-height:1}
.elige button.on{border-color:var(--viol);background:rgba(169,139,240,.16)}
.elige button:focus-visible,.chip:focus-visible,.bt:focus-visible,a.bt:focus-visible,summary:focus-visible{outline:2px solid var(--oro);outline-offset:2px}
.paso{display:flex;align-items:center;gap:8px;margin:18px 0 8px;font-weight:700;font-size:15px}
.paso i{font-style:normal;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--viol2);color:#fff;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:9px 12px;border-radius:999px;cursor:pointer;font:inherit;font-size:14px;
  background:var(--caja);border:1px solid var(--raya);color:var(--tinta);text-align:left}
.chip.on{background:rgba(169,139,240,.22);border-color:var(--viol)}
textarea,input{width:100%;font:inherit;font-size:16px;color:var(--tinta);background:rgba(0,0,0,.18);border:1px solid var(--raya);border-radius:12px;padding:12px}
textarea{resize:vertical;min-height:128px}
textarea:focus,input:focus{outline:2px solid var(--viol);outline-offset:1px;border-color:transparent}
textarea::placeholder,input::placeholder{color:var(--tenue)}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 6px}
.cuenta{display:block;text-align:right;font-size:12px;color:var(--tenue);margin-top:4px;font-variant-numeric:tabular-nums}
.tip{font-size:13px;color:var(--tenue);margin:6px 0 0}
.bt,a.bt{display:block;width:100%;margin-top:14px;padding:14px;border-radius:12px;border:0;cursor:pointer;background:var(--oro);color:#0B2A3A;
  font:inherit;font-weight:800;text-align:center;text-decoration:none}
.bt.sec{background:transparent;color:var(--tinta);border:1px solid var(--raya);font-weight:700}
.bt:disabled{opacity:.6;cursor:default}
.msg{min-height:20px;font-size:14px;margin:10px 0 0}
.msg.mal{color:var(--mal)} .msg.ok{color:var(--bien)}
.tarj{background:var(--caja);border:1px solid var(--raya);border-radius:16px;padding:18px;margin-top:16px}
.ok{text-align:center}
.ok .ic{display:inline-grid;place-items:center;width:56px;height:56px;border-radius:50%;background:rgba(111,208,140,.16);color:var(--bien);font-size:28px;font-weight:800}
.num{font:800 26px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em;margin:8px 0;color:#fff;font-variant-numeric:tabular-nums}
.grave{display:flex;gap:12px;align-items:flex-start;margin-top:18px;padding:14px;border-radius:14px;background:rgba(255,154,139,.08);border:1px solid rgba(255,154,139,.3)}
.grave p{font-size:14px;margin:4px 0 0}
.urg{font-size:13.5px;color:var(--suave);margin:12px 0 0}
details{margin-top:18px;border-top:1px solid var(--raya);padding-top:12px}
summary{cursor:pointer;font-weight:700;font-size:14.5px;color:var(--tinta)}
.fila{display:flex;gap:8px;margin-top:10px}
.fila input{text-transform:uppercase;letter-spacing:.08em}
.fila .bt{width:auto;margin:0;padding:0 18px}
.res{margin-top:10px;font-size:14px}
.res b{color:#fff}
.obra{margin-top:22px;font-size:12.5px;color:var(--tenue);letter-spacing:.04em;text-align:center}
[hidden]{display:none!important}

      'Con él ves la respuesta, desde este o desde otro celular. No está ligado a tu nombre: si lo pierdes, nadie te lo puede volver a dar. Anótalo ahora.':'Avec lui, vous voyez la réponse, depuis ce téléphone ou un autre. Il n’est pas lié à votre nom : si vous le perdez, personne ne peut vous le redonner. Notez-le maintenant.',
      'Copiar el número':'Copier le numéro','Copiado':'Copié','Listo, ya lo anoté':'C’est bon, je l’ai noté',
      'Llegó la primera versión que mandaste, antes de que se cortara la señal; la corrección no.':'C’est la première version envoyée qui est arrivée, avant la coupure du réseau ; la correction non.',
      '¿Ya hiciste una? Mira cómo va':'Vous en avez déjà fait un ? Voyez où il en est','Ver':'Voir','Buscando…':'Recherche…',
      'Ese número no está. Revisa que esté bien escrito.':'Ce numéro n’existe pas. Vérifiez qu’il est bien écrit.',
      'Escribe el número completo: son doce letras y números.':'Écrivez le numéro complet : douze lettres et chiffres.',
      'Enviada · todavía no la leen':'Envoyé · pas encore lu','Leída · la están revisando':'Lu · en cours d’examen','Cerrada':'Clôturé','La respuesta:':'La réponse :',
      'Un riesgo que nadie ve':'Un risque que personne ne voit','Una queja':'Une plainte','Algo que se puede mejorar':'Quelque chose à améliorer','Un EPP que falta':'Un EPI qui manque',
      'Una máquina o herramienta':'Une machine ou un outil','Trato y convivencia':'Respect et vie commune','Otra cosa':'Autre chose',
      'Me mandan a trabajar sin seguridad':'On m’envoie travailler sans sécurité','Represalia por reportar o por negarme a un trabajo peligroso':'Représailles pour avoir signalé ou refusé un travail dangereux',
      'Acoso u hostigamiento sexual':'Harcèlement sexuel','Maltrato, insultos o discriminación':'Maltraitance, insultes ou discrimination','Alcohol o drogas en la obra':'Alcool ou drogue sur le chantier',
      'Esconden un accidente o un incidente':'On cache un accident ou un incident','Robo, coima o fraude':'Vol, pot-de-vin ou fraude',
      'Este cartel está incompleto':'Cette affiche est incomplète','Al código QR le falta su ficha. Pídele a tu supervisor que vuelva a imprimir el cartel desde OBRASST.':'Il manque la clé au code QR. Demandez à votre superviseur de réimprimer l’affiche depuis OBRASST.',
      'Este cartel ya no está activo':'Cette affiche n’est plus active','Pídele a tu supervisor el cartel nuevo del buzón: se imprime desde OBRASST, en «Los QR de tu obra».':'Demandez à votre superviseur la nouvelle affiche de la boîte à idées : elle s’imprime depuis OBRASST, dans « Les QR de votre chantier ».',
      'Sin señal':'Pas de réseau','Necesitas datos o wifi para mandar. Lo que escribiste sigue aquí: inténtalo otra vez en un rato.':'Il faut des données ou du wifi pour envoyer. Ce que vous avez écrit est toujours là : réessayez dans un moment.',
      'Necesitas datos o wifi para abrir el buzón.':'Il faut des données ou du wifi pour ouvrir la boîte.','Intentar otra vez':'Réessayer',
      'El buzón todavía no está activo en el servidor. Avísale a tu supervisor.':'La boîte n’est pas encore active sur le serveur. Prévenez votre superviseur.',
      'La obra recibió muchas en esta hora. Inténtalo en un rato.':'Le chantier en a reçu beaucoup cette heure-ci. Réessayez dans un moment.',
      'No se pudo mandar. Inténtalo otra vez.':'Impossible d’envoyer. Réessayez.'}
  };
  if(!TX[L]) L='es';
  function t(s){ var v=TX[L] && TX[L][s]; v=(v===undefined) ? s : v; for(var i=1;i<arguments.length;i++) v=v.split('{'+(i-1)+'}').join(arguments[i]); return v; }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function q(n){ try{ return new URLSearchParams(location.search).get(n)||''; }catch(e){ return ''; } }
  try{ document.documentElement.lang=L; document.title=t('Buzón de la obra')+' · OBRASST'; }catch(_d){}
  /* los mismos temas y tipos de la app (el texto en castellano es lo que se guarda) */
  var TEMAS=[['Un riesgo que nadie ve','⚠️'],['Una queja','📣'],['Algo que se puede mejorar','💡'],['Un EPP que falta','🧤'],
             ['Una máquina o herramienta','🛠️'],['Trato y convivencia','🤝'],['Otra cosa','✍️']];
  var TIPOS=[['sin_seguridad','⛑️','Me mandan a trabajar sin seguridad'],['represalia','✋','Represalia por reportar o por negarme a un trabajo peligroso'],
             ['hostigamiento','🚫','Acoso u hostigamiento sexual'],['maltrato','🗣️','Maltrato, insultos o discriminación'],
             ['alcohol','🍺','Alcohol o drogas en la obra'],['ocultan','📋','Esconden un accidente o un incidente'],
             ['fraude','💰','Robo, coima o fraude'],['otro','💬','Otra cosa']];
  var EST={nueva:'Enviada · todavía no la leen', revision:'Leída · la están revisando', cerrada:'Cerrada'};
  /* como el canal de denuncia de la app: con la llave pública, sin cookies, sin decir de qué página viene */
  function rpc(fn, args){
    var op={ method:'POST', credentials:'omit', cache:'no-store', referrerPolicy:'no-referrer',
             headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'}, body:JSON.stringify(args||{}) };
    try{ var ac=new AbortController(); setTimeout(function(){ try{ ac.abort(); }catch(_a){} }, 30000); op.signal=ac.signal; }catch(_e){}
    return fetch(SB+'/rest/v1/rpc/'+fn, op).then(function(r){ return r.ok ? r.json() : Promise.reject(r.status); });
  }
  /* doce letras al azar, sin las que se confunden (I, O, 0, 1) */
  function numero(){
    var a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789', s='', b=new Uint8Array(12);
    crypto.getRandomValues(b);
    for(var i=0;i<12;i++) s+=a.charAt(b[i]%32);
    return s;
  }
  function bonito(n){ n=String(n||'').toUpperCase().replace(/[^A-Z0-9]/g,''); return n.slice(0,4)+'-'+n.slice(4,8)+'-'+n.slice(8,12); }
  var tk=q('t'), cuerpo=document.getElementById('cuerpo'), pie=document.getElementById('pie');
  /* «listo» = la sugerencia llegó; «recien» = el número de la denuncia que acaba de llegar (se ve hasta «Listo, ya lo anoté») */
  var E={ obra:'', modo:'sug', tema:'', tipo:'', txt:'', dtxt:'', lugar:'', num:'', texto1:'', listo:false, recien:'', primera:false, mandando:false };
  document.getElementById('abriendo').textContent=t('Abriendo el buzón…');
  function aviso(tit, txt, boton){
    cuerpo.innerHTML='<h1>'+esc(tit)+'</h1><div class="tarj"><p style="margin:0">'+esc(txt)+'</p></div>'+
      (boton ? '<button type="button" class="bt" id="b-otra">'+esc(t('Intentar otra vez'))+'</button>' : '');
    var b=document.getElementById('b-otra'); if(b) b.onclick=abrir;
  }
  function msg(cl, s){ var m=document.getElementById('b-msg'); if(m){ m.className='msg'+(cl ? ' '+cl : ''); m.textContent=s||''; } }
  function cab(){
    return '<div class="cab"><h1>'+esc(E.obra ? t('Buzón de {0}', E.obra) : t('Buzón de la obra'))+'</h1>'+
      '<p>'+esc(t('Lo que escribas llega a la obra sin tu nombre. No necesitas instalar nada.'))+'</p>'+
      '<div class="sellos"><span class="sello">🙈 '+esc(t('Sin tu nombre'))+'</span><span class="sello">🪪 '+esc(t('Sin tu DNI'))+'</span>'+
      '<span class="sello">📲 '+esc(t('Sin instalar nada'))+'</span></div></div>'+
      '<div class="elige" role="tablist">'+
      '<button type="button" role="tab" id="b-m-sug" aria-selected="'+(E.modo==='sug')+'" class="'+(E.modo==='sug' ? 'on' : '')+'"><span class="ic">💬</span><b>'+esc(t('Una sugerencia o una queja'))+'</b><small>'+esc(t('Para mejorar algo que ves en la obra.'))+'</small></button>'+
      '<button type="button" role="tab" id="b-m-den" aria-selected="'+(E.modo==='den')+'" class="'+(E.modo==='den' ? 'on' : '')+'"><span class="ic">🛡️</span><b>'+esc(t('Una denuncia'))+'</b><small>'+esc(t('Reservada: para lo que cuesta decir en voz alta.'))+'</small></button></div>';
  }
  function pintar(){
    var h=cab();
    if(E.modo==='sug'){
      if(E.listo){
        h+='<div class="tarj ok" role="status"><div class="ic">✓</div><h2 style="margin-top:10px">'+esc(t('Llegó al buzón'))+'</h2>'+
           '<p>'+esc(t('Está en el buzón de tu obra, sin tu nombre. Gracias por decirlo: así es como se arreglan las cosas.'))+'</p>'+
           '<button type="button" class="bt sec" id="b-otra-sug">'+esc(t('Escribir otra cosa'))+'</button></div>';
      } else {
        h+='<div class="paso"><i>1</i><span>'+esc(t('¿De qué se trata?'))+'</span></div><div class="chips">'+
          TEMAS.map(function(x, i){ return '<button type="button" class="chip'+(E.tema===x[0] ? ' on' : '')+'" aria-pressed="'+(E.tema===x[0])+'" data-tema="'+i+'"><span aria-hidden="true">'+x[1]+'</span><span>'+esc(t(x[0]))+'</span></button>'; }).join('')+'</div>'+
          '<div class="paso"><i>2</i><span>'+esc(t('Cuéntalo con tus palabras'))+'</span></div>'+
          '<textarea id="b-x" rows="5" maxlength="3000" aria-label="'+esc(t('Cuéntalo con tus palabras'))+'">'+esc(E.txt)+'</textarea>'+
          '<span class="cuenta" id="b-n">'+E.txt.length+' / 3000</span>'+
          '<p class="tip">'+esc(t('Di dónde y desde cuándo: así se arregla más rápido.'))+'</p>'+
          '<div class="msg" id="b-msg" role="status"></div>'+
          '<button type="button" class="bt" id="b-mandar">'+esc(t('Mandarlo sin mi nombre'))+'</button>'+
          '<div class="grave"><span aria-hidden="true" style="font-size:22px">🛡️</span><div><b>'+esc(t('¿Es algo grave?'))+'</b>'+
          '<p>'+esc(t('Una represalia, acoso, o que te mandan a trabajar sin seguridad: usa la denuncia, que es más reservada.'))+'</p>'+
          '<button type="button" class="bt sec" id="b-ir-den" style="margin-top:10px">'+esc(t('Hacer una denuncia'))+'</button></div></div>';
      }
    } else {
      if(E.recien){
        h+='<div class="tarj ok" role="status"><div class="ic">✓</div><h2 style="margin-top:10px">'+esc(t('Enviada'))+'</h2>'+
           '<p>'+esc(t('Llega a la obra mañana a las 7, junto con las demás del día.'))+'</p>'+
           (E.primera ? '<p>'+esc(t('Llegó la primera versión que mandaste, antes de que se cortara la señal; la corrección no.'))+'</p>' : '')+
           '<p style="margin-top:12px">'+esc(t('Tu número de seguimiento:'))+'</p><div class="num" id="b-num">'+esc(bonito(E.recien))+'</div>'+
           '<p>'+esc(t('Con él ves la respuesta, desde este o desde otro celular. No está ligado a tu nombre: si lo pierdes, nadie te lo puede volver a dar. Anótalo ahora.'))+'</p>'+
           '<button type="button" class="bt sec" id="b-copiar">'+esc(t('Copiar el número'))+'</button>'+
           '<button type="button" class="bt" id="b-listo">'+esc(t('Listo, ya lo anoté'))+'</button></div>';
      } else {
        h+='<div class="tarj" style="margin-top:12px"><p style="margin:0">'+esc(t('No te pide tu nombre ni tu DNI, y no guarda la hora: solo el día. La leen solo el dueño de la obra y quienes él elija, a la mañana siguiente, junto con las demás del día.'))+'</p></div>'+
          '<p class="urg">'+esc(t('¿Alguien está en peligro ahora mismo? No esperes una respuesta: avisa en el frente o llama a emergencias.'))+'</p>'+
          '<div class="paso"><i>1</i><span>'+esc(t('¿Qué quieres denunciar?'))+'</span></div><div class="chips">'+
          TIPOS.map(function(x){ return '<button type="button" class="chip'+(E.tipo===x[0] ? ' on' : '')+'" aria-pressed="'+(E.tipo===x[0])+'" data-tipo="'+x[0]+'"><span aria-hidden="true">'+x[1]+'</span><span>'+esc(t(x[2]))+'</span></button>'; }).join('')+'</div>'+
          '<div class="paso"><i>2</i><span>'+esc(t('Cuéntalo con tus palabras'))+'</span></div>'+
          '<textarea id="b-dx" rows="6" maxlength="3000" aria-label="'+esc(t('Cuéntalo con tus palabras'))+'" placeholder="'+esc(t('Qué pasó, desde cuándo, y qué debería hacerse. No hace falta nombrar a nadie si no quieres.'))+'">'+esc(E.dtxt)+'</textarea>'+
          '<label for="b-lugar">'+esc(t('¿Dónde? (si quieres)'))+'</label>'+
          '<input id="b-lugar" maxlength="120" autocomplete="off" placeholder="'+esc(t('Frente, piso o zona'))+'" value="'+esc(E.lugar)+'">'+
          '<p class="tip">'+esc(t('Un lugar muy preciso puede delatar quién lo vio. Pon solo lo necesario.'))+'</p>'+
          '<div class="msg" id="b-msg" role="status"></div>'+
          '<button type="button" class="bt" id="b-enviar">'+esc(t('Enviar la denuncia'))+'</button>';
      }
      h+='<details id="b-seguir"><summary>'+esc(t('¿Ya hiciste una? Mira cómo va'))+'</summary>'+
         '<div class="fila"><input id="b-num-otro" maxlength="16" autocomplete="off" placeholder="XXXX-XXXX-XXXX" aria-label="'+esc(t('Tu número de seguimiento:'))+'">'+
         '<button type="button" class="bt" id="b-ver">'+esc(t('Ver'))+'</button></div><div class="res" id="b-res" role="status"></div></details>';
    }
    cuerpo.innerHTML=h;
    atar();
  }
  function atar(){
    function on(id, fn){ var e=document.getElementById(id); if(e) e.onclick=fn; }
    on('b-m-sug', function(){ if(E.modo==='sug') return; E.modo='sug'; pintar(); });
    on('b-m-den', function(){ if(E.modo==='den') return; E.modo='den'; pintar(); });
    on('b-ir-den', function(){ E.modo='den'; pintar(); try{ window.scrollTo(0,0); }catch(_s){} });
    on('b-otra-sug', function(){ E.listo=false; pintar(); });
    on('b-mandar', mandar);
    on('b-enviar', denunciar);
    on('b-copiar', function(){
      var n=bonito(E.recien), b=document.getElementById('b-copiar');
      var fin=function(){ if(b) b.textContent=t('Copiado'); };
      try{ navigator.clipboard.writeText(n).then(fin, function(){}); }catch(_c){}
    });
    on('b-listo', function(){ E.recien=''; E.primera=false; E.tipo=''; E.dtxt=''; E.lugar=''; pintar(); try{ window.scrollTo(0,0); }catch(_s){} });
    on('b-ver', seguir);
    [].forEach.call(cuerpo.querySelectorAll('[data-tema]'), function(b){
      b.onclick=function(){
        var x=TEMAS[+b.getAttribute('data-tema')][0]; E.tema=(E.tema===x) ? '' : x;
        [].forEach.call(cuerpo.querySelectorAll('[data-tema]'), function(c){ var si=(TEMAS[+c.getAttribute('data-tema')][0]===E.tema); c.className='chip'+(si ? ' on' : ''); c.setAttribute('aria-pressed', String(si)); });
        msg('', '');
      };
    });
    [].forEach.call(cuerpo.querySelectorAll('[data-tipo]'), function(b){
      b.onclick=function(){
        E.tipo=b.getAttribute('data-tipo');
        [].forEach.call(cuerpo.querySelectorAll('[data-tipo]'), function(c){ var si=(c.getAttribute('data-tipo')===E.tipo); c.className='chip'+(si ? ' on' : ''); c.setAttribute('aria-pressed', String(si)); });
        msg('', '');
      };
    });
    var x=document.getElementById('b-x');
    if(x) x.oninput=function(){ E.txt=String(x.value||''); var n=document.getElementById('b-n'); if(n) n.textContent=E.txt.length+' / 3000'; msg('', ''); };
    var dx=document.getElementById('b-dx'); if(dx) dx.oninput=function(){ E.dtxt=String(dx.value||''); msg('', ''); };
    var lg=document.getElementById('b-lugar'); if(lg) lg.oninput=function(){ E.lugar=String(lg.value||''); };
  }
  function mandar(){
    if(E.mandando) return;
    var x=String(E.txt||'').trim(), b=document.getElementById('b-mandar');
    if(x.length<8){ msg('mal', t('Escribe un poco más para que se entienda.')); return; }
    E.mandando=true; if(b) b.disabled=true; msg('', t('Mandando…'));
    rpc('sst_buzon_mandar', {p_t:tk, p_tema:E.tema||null, p_texto:x}).then(function(r){
      E.mandando=false; if(b) b.disabled=false;
      if(r && r.ok===true){ E.tema=''; E.txt=''; E.listo=true; pintar(); try{ window.scrollTo(0,0); }catch(_s){} return; }
      var mo=r && r.motivo;
      if(mo==='no_existe'){ aviso(t('Este cartel ya no está activo'), t('Pídele a tu supervisor el cartel nuevo del buzón: se imprime desde OBRASST, en «Los QR de tu obra».')); return; }
      if(mo==='corto'){ msg('mal', t('Escribe un poco más para que se entienda.')); return; }
      if(mo==='muy_seguido') { msg('mal', t('La obra recibió muchas en esta hora. Inténtalo en un rato.')); return; }
      msg('mal', t('No se pudo mandar. Inténtalo otra vez.'));
    }, function(err){
      E.mandando=false; if(b) b.disabled=false;
      msg('mal', err===404 ? t('El buzón todavía no está activo en el servidor. Avísale a tu supervisor.') : t('Necesitas datos o wifi para mandar. Lo que escribiste sigue aquí: inténtalo otra vez en un rato.'));
    });
  }
  function denunciar(){
    if(E.mandando) return;
    var x=String(E.dtxt||'').trim(), lugar=String(E.lugar||'').trim(), b=document.getElementById('b-enviar');
    if(!E.tipo){ msg('mal', t('Elige primero de qué se trata.')); return; }
    if(x.length<10){ msg('mal', t('Cuéntalo con un poco más de detalle, para que se entienda.')); return; }
    /* el número se elige una vez: si se corta la señal y se reintenta, va el mismo (y el servidor dice «ya está») */
    if(!E.num){ E.num=numero(); E.texto1=x; }
    var num=E.num;
    E.mandando=true; if(b) b.disabled=true; msg('', t('Enviando…'));
    rpc('sst_buzon_denunciar', {p_t:tk, p_tipo:E.tipo, p_texto:x, p_lugar:lugar||null, p_seguimiento:num}).then(function(r){
      E.mandando=false; if(b) b.disabled=false;
      var mo=r && r.motivo;
      if((r && r.ok===true) || mo==='seguimiento_repetido'){
        E.primera=(mo==='seguimiento_repetido' && E.texto1 && E.texto1!==x);
        E.recien=num; E.num=''; E.texto1=''; pintar(); try{ window.scrollTo(0,0); }catch(_s){} return;
      }
      if(mo==='no_existe'){ aviso(t('Este cartel ya no está activo'), t('Pídele a tu supervisor el cartel nuevo del buzón: se imprime desde OBRASST, en «Los QR de tu obra».')); return; }
      if(mo==='corto'){ msg('mal', t('Cuéntalo con un poco más de detalle, para que se entienda.')); return; }
      if(mo==='muy_seguido'){ msg('mal', t('La obra recibió muchas en esta hora. Inténtalo en un rato.')); return; }
      msg('mal', t('No se pudo mandar. Inténtalo otra vez.'));
    }, function(err){
      E.mandando=false; if(b) b.disabled=false;
      msg('mal', err===404 ? t('El buzón todavía no está activo en el servidor. Avísale a tu supervisor.') : t('Necesitas datos o wifi para mandar. Lo que escribiste sigue aquí: inténtalo otra vez en un rato.'));
    });
  }
  function seguir(){
    var i=document.getElementById('b-num-otro'), res=document.getElementById('b-res');
    var n=String((i && i.value) || '').toUpperCase().replace(/[^A-Z0-9]/g,'');
    if(!res) return;
    if(n.length<12){ res.textContent=t('Escribe el número completo: son doce letras y números.'); return; }
    res.textContent=t('Buscando…');
    rpc('sst_denuncia_seguir', {p_seguimiento:n}).then(function(r){
      if(!r || r.ok!==true){ res.textContent=t('Ese número no está. Revisa que esté bien escrito.'); return; }
      res.innerHTML='<b>'+esc(t(EST[r.estado] || r.estado || ''))+'</b>'+(r.respuesta ? '<p style="margin:6px 0 0">'+esc(t('La respuesta:'))+' '+esc(r.respuesta)+'</p>' : '');
    }, function(){ res.textContent=t('Necesitas datos o wifi para abrir el buzón.'); });
  }
  function abrir(){
    if(!/^[A-Za-z0-9]{8,64}$/.test(tk)){ aviso(t('Este cartel está incompleto'), t('Al código QR le falta su ficha. Pídele a tu supervisor que vuelva a imprimir el cartel desde OBRASST.')); return; }
    cuerpo.innerHTML='<h1>'+esc(t('Abriendo el buzón…'))+'</h1><div class="giro"></div>';
    rpc('sst_buzon_abrir', {p_t:tk}).then(function(r){
      if(r && r.ok===true){ E.obra=String(r.obra||''); pie.textContent=E.obra; pintar(); return; }
      if(r && r.error==='no_existe'){ aviso(t('Este cartel ya no está activo'), t('Pídele a tu supervisor el cartel nuevo del buzón: se imprime desde OBRASST, en «Los QR de tu obra».')); return; }
      aviso(t('Este cartel está incompleto'), t('Al código QR le falta su ficha. Pídele a tu supervisor que vuelva a imprimir el cartel desde OBRASST.'));
    }, function(err){
      if(err===404){ aviso(t('Buzón de la obra'), t('El buzón todavía no está activo en el servidor. Avísale a tu supervisor.')); return; }
      aviso(t('Sin señal'), t('Necesitas datos o wifi para abrir el buzón.'), true);
    });
  }
  abrir();
})();
</script>
</body></html>
