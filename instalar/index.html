}catch(e){} })();

/* ── qué equipo es ── */
var UA = navigator.userAgent || '';
function idioma(){
  var q = ''; try{ q = (new URLSearchParams(location.search)).get('l') || ''; }catch(e){}
  var l = String(q || navigator.language || (navigator.languages || [])[0] || 'es').slice(0, 2).toLowerCase();
  return TX[l] ? l : 'es';
}
var L = idioma(), T = TX[L];
function esIOS(){ return /iPad|iPhone|iPod/.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
function esAndroid(){ return /Android/i.test(UA); }
/* «; wv)» es la marca del visor que usan Facebook, Instagram y otras apps para abrir enlaces sin salir de ellas */
function embebido(){ return /FBAN|FBAV|FB_IAB|Instagram|Line\/|MicroMessenger|; wv\)/i.test(UA); }
/* Chrome «de verdad»: su menú son los tres puntitos de arriba a la derecha. En los demás navegadores se dice «el menú» */
function esChrome(){ return /Chrome\/\d/.test(UA) && !/SamsungBrowser|EdgA|OPR\/|Opera|Firefox|MiuiBrowser|HuaweiBrowser|UCBrowser|YaBrowser|DuckDuckGo|Vivaldi|Brave/i.test(UA); }
/* Safari del iPhone: trae «Version/NN» y «Safari/», y no la marca de otro navegador ni de una app */
function esSafari(){ return /Safari\//.test(UA) && /Version\/\d/.test(UA) && !/CriOS|FxiOS|EdgiOS|OPiOS|OPT\/|GSA\/|DuckDuckGo|YaBrowser/i.test(UA) && !embebido(); }
/* Safari 26 o más: Compartir va dentro del botón ⋯ */
function safariNuevo(){ var m = /Version\/(\d+)/.exec(UA); return !!m && +m[1] >= 26; }
function caso(){
  if(esIOS()) return esSafari() ? 'ios' : 'ios-otro';
  if(esAndroid()) return embebido() ? 'android-otra-app' : 'android';
  return 'pc';
}
var CASO = caso();

/* ── los dibujitos ── */
var G = {
  bajar:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11"/><path d="m7 11 5 5 5-5"/><path d="M5 20h14"/></svg>',
  ok:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
  menu:'<span class="gl"><svg class="r" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></span>',
  mas:'<span class="gl"><svg class="r" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></span>',
  comp:'<span class="gl"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3.5"/><path d="m8 7 4-4 4 4"/><path d="M7 10.5H5.5v10h13v-10H17"/></svg></span>',
  agr:'<span class="gl"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8.5v7M8.5 12h7"/></svg></span>',
  copia:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8.5" y="8.5" width="11" height="11" rx="2"/><path d="M5 15.5h-.5v-11h11V5"/></svg>',
  abre:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4.5h5.5V10"/><path d="M19.5 4.5 11 13"/><path d="M18 14v5.5H4.5V6H10"/></svg>'
};
function $(id){ return document.getElementById(id); }
function tx(k, p){ var s = T[k] || TX.es[k] || ''; if(p) Object.keys(p).forEach(function(n){ s = s.split('{' + n + '}').join(p[n]); }); return s; }
function esto(){ return location.origin + location.pathname; }
function copiar(msgId, dicho){
  var u = (CASO === 'pc') ? CORTA : esto(), m = $(msgId);
  var fin = function(ok){ if(m) m.textContent = ok ? dicho : (T.a_mano + ' ' + u); };
  try{ navigator.clipboard.writeText(u).then(function(){ fin(true); }, function(){ fin(false); }); }catch(e){ fin(false); }
}
/* salir a Chrome desde el visor de otra app (o desde un navegador que no instala) */
function enChrome(){
  var u = esto().replace(/^https?:\/\//, '');
  return 'intent://' + u + '#Intent;scheme=' + location.protocol.replace(':', '') + ';package=com.android.chrome;end';
}
function puntos(){ return '<ul class="pts"><li>' + T.p1 + '</li><li>' + T.p2 + '</li><li>' + T.p3 + '</li></ul>'; }

/* ── Android: el navegador avisa con «beforeinstallprompt» cuando ya deja abrir su cuadro de instalar ── */
var EV = null, USADO = false, EST = 'ini';    /* ini · guia · instalando · instalada · cancelada · tenia */
function pintarAndroid(){
  var listo = !!EV && !USADO, h = '';
  if(EST === 'tenia'){
    h = '<h1>' + T.a_h1 + '</h1><div class="estado" role="status"><h2>' + G.ok + T.e_tenia_t + '</h2>' + T.e_tenia + '<a class="bt" id="abrir-app" href="../">' + T.abrir_app + '</a></div>' + puntos();
    $('cuerpo').innerHTML = h; return;
  }
  if(EST === 'instalada' || EST === 'instalando'){
    h = '<h1>' + T.a_h1 + '</h1>' +
      (EST === 'instalada'
        ? '<div class="estado" id="estado" role="status"><h2>' + G.ok + T.e_ok_t + '</h2>' + T.e_ok + '<a class="bt" id="abrir-app" href="../">' + T.abrir_app + '</a></div>'
        : '<div class="estado gris" id="estado" role="status"><h2><span class="gira" aria-hidden="true"></span>' + T.e_inst_t + '</h2>' + T.e_inst + '</div>') + puntos();
    $('cuerpo').innerHTML = h; return;
  }
  h = '<h1>' + T.a_h1 + '</h1><p class="lead">' + T.a_lead + '</p>' +
    '<button type="button" class="bt' + (listo && EST !== 'ini' ? ' pulso' : '') + '" id="bt">' + G.bajar + '<span>' + (listo && EST !== 'ini' ? T.a_bt2 : T.a_bt) + '</span></button>';
  if(EST === 'cancelada') h += '<p class="msg" id="msg" role="status">' + T.e_no + '</p>';
  if(EST === 'ini') h += '<p class="nota" id="nota">' + T.a_nota + '</p>';
  if((EST === 'guia' || EST === 'cancelada') && listo) h += '<p class="listo" id="guia-listo" role="status">' + T.g_listo + '</p>';
  else if(EST === 'guia' || EST === 'cancelada'){
    h += '<div class="caja" id="guia"><h2>' + T.g_t + '</h2>' +
      '<ol class="pasos"><li>' + (esChrome() ? tx('g_1c', { m:G.menu }) : T.g_1o) + '</li><li>' + T.g_2 + '</li><li>' + T.g_3 + '</li></ol>' +
      /* si ya está instalada, el navegador no ofrece instalarla: en su menú dice «Abrir OBRASST» */
      (esChrome() ? '<p class="mas" id="g-ya">' + T.g_ya + '</p>' : '<p class="mas">' + T.g_chrome + ' <a id="a-chrome" href="' + enChrome() + '">' + T.g_chrome_a + '</a></p>') + '</div>';
  }
  h += puntos() + '<p class="otros"><a id="abrir" href="../">' + T.abrir + '</a></p>';
  $('cuerpo').innerHTML = h;
  $('bt').onclick = instalar;
}
function instalar(){
  if(EV && !USADO){
    var ev = EV; USADO = true;
    try{ ev.prompt(); }catch(e){ EV = null; USADO = false; EST = 'guia'; pintarAndroid(); return; }
    Promise.resolve(ev.userChoice).then(function(r){
      EV = null; USADO = false;
      if(r && r.outcome === 'accepted'){
        if(EST !== 'instalada'){ EST = 'instalando'; pintarAndroid(); }
        calentar();
        /* algunos navegadores no avisan cuando terminan: a los 25 s se da por instalada */
        setTimeout(function(){ if(EST === 'instalando'){ EST = 'instalada'; pintarAndroid(); } }, 25000);
      } else { EST = 'cancelada'; pintarAndroid(); }
    }, function(){ EV = null; USADO = false; EST = 'guia'; pintarAndroid(); });
    return;
  }
  /* el navegador todavía no dio permiso (o no lo da nunca): se dice dónde está su opción de instalar */
  EST = 'guia'; pintarAndroid();
  try{ var g = $('guia'); if(g) g.scrollIntoView({ block:'nearest', behavior:'smooth' }); }catch(e){}
}
/* recién instalada: que la app baje y quede guardada mientras todavía hay señal (la primera vez que se abra, ya está) */
function calentar(){ try{ if('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js', { scope:'../' }).catch(function(){}); }catch(e){} }
window.addEventListener('beforeinstallprompt', function(e){
  try{ e.preventDefault(); }catch(x){}
  EV = e; USADO = false;
  if(CASO === 'android' && (EST === 'ini' || EST === 'guia' || EST === 'cancelada')) pintarAndroid();
});
window.addEventListener('appinstalled', function(){
  EV = null;
  if(CASO === 'android'){ EST = 'instalada'; pintarAndroid(); calentar(); }
});

function pintarOtraApp(){
  $('cuerpo').innerHTML = '<h1>' + T.w_h1 + '</h1><p class="lead">' + T.w_lead + '</p>' +
    '<a class="bt" id="bt" href="' + enChrome() + '">' + G.abre + '<span>' + T.w_bt + '</span></a>' +
    '<div class="fila"><button type="button" class="sec" id="copiar">' + G.copia + T.copiar + '</button></div><p class="msg" id="msg" role="status"></p>' +
    '<p class="nota">' + T.w_alt + '</p>' + puntos();
  $('copiar').onclick = function(){ copiar('msg', T.copiado_c); };
}
function pintarIOS(){
  var n = safariNuevo();
  $('cuerpo').innerHTML = '<h1>' + T.i_h1 + '</h1><p class="lead">' + T.i_lead + '</p>' +
    '<div class="caja" id="guia" style="margin-top:0"><h2>' + T.i_t + '</h2><ol class="pasos">' +
      '<li>' + tx(n ? 'i_1n' : 'i_1v', { mas:G.mas, comp:G.comp }) + '</li><li>' + tx('i_2', { agr:G.agr }) + '</li><li>' + (n ? T.i_3n : T.i_3v) + '</li></ol></div>' +
    '<p class="nota">' + T.i_nota + '</p>' + puntos() + '<p class="otros"><a id="abrir" href="../">' + T.abrir + '</a></p>';
}
function pintarIOSOtro(){
  $('cuerpo').innerHTML = '<h1>' + T.o_h1 + '</h1><p class="lead">' + T.o_lead + '</p>' +
    '<button type="button" class="bt" id="copiar">' + G.copia + '<span>' + T.copiar + '</span></button><p class="msg" id="msg" role="status"></p>' +
    '<div class="caja" id="guia"><h2>' + T.i_t + '</h2><ol class="pasos">' +
      '<li>' + tx('i_1v', { mas:G.mas, comp:G.comp }) + '</li><li>' + tx('i_2', { agr:G.agr }) + '</li><li>' + T.i_3v + '</li></ol></div>' +
    puntos() + '<p class="otros"><a id="abrir" href="../">' + T.abrir + '</a></p>';
  $('copiar').onclick = function(){ copiar('msg', T.copiado_s); };
}
function pintarPC(){
  $('cuerpo').innerHTML = '<div class="centro"><h1>' + T.d_h1 + '</h1><p class="lead">' + T.d_lead + '</p>' +
    '<div class="qr" id="qr" role="img" aria-label="' + T.d_qr + '"><svg viewBox="0 0 ' + QR_N + ' ' + QR_N + '" shape-rendering="crispEdges"><path fill="#0B2A3A" d="' + QR_D + '"/></svg></div>' +
    '<p class="dir">' + T.d_o + '<b id="corta">' + CORTA.replace(/^https:\/\//, '') + '</b></p>' +
    '<div class="fila"><button type="button" class="sec" id="copiar">' + G.copia + T.copiar + '</button></div><p class="msg" id="msg" role="status"></p></div>' +
    '<div class="pc"><h2>' + T.d_pc_t + '</h2><p>' + T.d_pc + '</p><a class="sec" id="portal" href="' + PORTAL + '">' + T.d_portal + '</a></div>' + puntos();
  $('copiar').onclick = function(){ copiar('msg', T.copiado); };
}

function pintar(){
  document.documentElement.lang = L; document.documentElement.setAttribute('data-caso', CASO);
  $('lema').textContent = T.lema;
  if(CASO === 'android') pintarAndroid();
  else if(CASO === 'android-otra-app') pintarOtraApp();
  else if(CASO === 'ios') pintarIOS();
  else if(CASO === 'ios-otro') pintarIOSOtro();
  else pintarPC();
}
pintar();
/* ¿ya está la app de Android (la del instalador) en este celular? Android lo dice */
try{
  if(CASO === 'android' && navigator.getInstalledRelatedApps){
    navigator.getInstalledRelatedApps().then(function(l){ if(l && l.length && EST === 'ini'){ EST = 'tenia'; pintarAndroid(); } }).catch(function(){});
  }
}catch(e){}
</script>
